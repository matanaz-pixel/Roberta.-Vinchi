<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ספר מתכונים</title>
<meta name="theme-color" content="#023305">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="./roberta-logo.png">
<link rel="manifest" href="./recipes.webmanifest">
<link rel="apple-touch-icon" href="./roberta-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ספר מתכונים">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --green:#023305; --green-soft:#e6efe6; --cream:#fbf8f2; --card:#ffffff;
    --line:#e9e3d6; --text:#1d2a1e; --text-dim:#6f7a6f; --accent:#ef4823;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; background:var(--cream); color:var(--text); font-family:'Rubik',sans-serif; -webkit-tap-highlight-color:transparent; }
  header{ background:var(--green); padding:22px 16px 20px; text-align:center; }
  header img{ height:34px; max-width:80%; }
  header .sub{ color:#cfe0cf; font-size:12px; letter-spacing:.18em; margin-top:10px; }
  .app{ width:100%; max-width:560px; margin:0 auto; padding:0 16px calc(60px + env(safe-area-inset-bottom)); }
  .app > .banner:first-child{ margin-top:12px; }

  .sticky{ position:sticky; top:0; z-index:5; background:var(--cream); margin:0 -16px 10px; padding:10px 16px 2px; box-shadow:0 1px 0 var(--line); }
  .search{
    width:100%; background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:13px 20px; font-size:16px; font-family:inherit; margin-bottom:8px; min-height:48px;
  }
  .search:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }

  .tabs{ display:flex; flex-wrap:wrap; gap:8px; padding-bottom:10px; }
  .tab{
    background:transparent; border:1px solid var(--line); color:var(--text-dim); min-height:44px;
    border-radius:999px; padding:8px 16px; font-size:15px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .tab .n{ font-size:12px; opacity:.7; margin-inline-start:5px; }
  .tab.active{ background:var(--green); border-color:var(--green); color:#fff; font-weight:500; }

  .card{ scroll-margin-top:76px; background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:10px; overflow:hidden; }
  .card-head{
    width:100%; background:none; border:none; color:var(--text); font-family:inherit; font-size:17px; font-weight:500;
    text-align:right; padding:16px 18px; min-height:60px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .scale{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:14px 0 2px; padding:10px 12px; background:var(--green-soft); border-radius:12px; font-size:14px; }
  .scale label{ color:var(--green); font-weight:500; }
  .scale input{ width:72px; min-height:44px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:16px; text-align:center; background:#fff; color:var(--text); }
  .scale input:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px #d4e4d4; }
  .scale input.bad{ border-color:var(--accent); }
  .scale .chips{ display:flex; gap:6px; width:100%; }
  .scale .chips .chip{ flex:1; }
  .scale .chip{ border:1px solid var(--line); background:#fff; color:var(--text-dim); border-radius:999px; padding:0 14px; min-width:44px; min-height:44px; font:inherit; font-size:15px; cursor:pointer; }
  .scale .chip.on{ background:var(--green); border-color:var(--green); color:#fff; }
  [hidden]{ display:none !important; }
  .mult-tag{ display:inline-block; margin-inline-start:8px; padding:2px 9px; border-radius:999px; background:var(--accent); color:#fff; font-size:11px; font-weight:600; vertical-align:middle; }
  .scale.var .chips{ flex-wrap:wrap; }
  .scale.var .chip{ flex:1 1 auto; white-space:nowrap; }
  .scale-hint.bad{ color:var(--accent); font-weight:500; }
  .scale-hint{ font-size:12px; color:var(--text-dim); margin-top:6px; }
  .fix-btn{ margin-top:10px; background:none; border:none; padding:12px 0; min-height:44px; color:var(--text-dim); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; }
  dialog.fix{ border:none; border-radius:18px; padding:0; width:min(520px, calc(100vw - 32px)); max-height:calc(100dvh - 24px); overflow:auto; background:var(--cream); color:var(--text); box-shadow:0 20px 60px rgba(0,0,0,.25); }
  dialog.fix::backdrop{ background:rgba(2,51,5,.45); }
  .fix-form{ padding:20px; display:flex; flex-direction:column; gap:12px; }
  .fix-form h2{ margin:0; font-size:18px; font-weight:500; color:var(--green); }
  .fix-form .sub2{ font-size:13px; color:var(--text-dim); margin-top:-6px; }
  .fix-form label{ font-size:13px; color:var(--text-dim); display:flex; flex-direction:column; gap:5px; }
  .fix-form select, .fix-form input[type=text], .fix-form textarea{ border:1px solid var(--line); border-radius:12px; padding:10px 12px; font:inherit; font-size:16px; background:#fff; color:var(--text); }
  .fix-form textarea{ width:100%; min-height:150px; resize:vertical; line-height:1.6; }
  @media (max-height:700px){ .fix-form{ padding:14px; gap:8px; } .fix-form textarea{ min-height:90px; } }
  .fix-form select:focus, .fix-form input:focus, .fix-form textarea:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .fix-actions{ display:flex; gap:10px; justify-content:flex-start; }
  .fix-actions button{ border-radius:999px; padding:12px 22px; min-height:48px; font:inherit; font-size:15px; cursor:pointer; border:1px solid var(--green); }
  .fix-actions .send{ background:var(--green); color:#fff; }
  .fix-actions .cancel{ background:transparent; color:var(--green); }
  .fix-actions button:disabled{ opacity:.55; cursor:default; }
  .fix-msg{ font-size:14px; padding:10px 12px; border-radius:12px; background:var(--green-soft); color:var(--green); }
  .fix-msg.err{ background:#fde8e3; color:#a3300f; }
  .fix-form .seg{ display:flex; gap:6px; }
  .fix-form .seg button{ flex:1; min-height:44px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--text-dim); font:inherit; font-size:14px; cursor:pointer; }
  .fix-form .seg button.on{ background:var(--green); border-color:var(--green); color:#fff; }
  .fix-form .chosen{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:8px 12px; background:var(--green-soft); border-radius:12px; }
  .fix-form .chosen .ct{ font-weight:600; color:var(--green); }
  .fix-form .chosen small{ color:var(--accent); }
  .fix-form .swap{ margin-inline-start:auto; min-height:36px; border:none; background:none; color:var(--text-dim); text-decoration:underline; font:inherit; font-size:13px; cursor:pointer; }
  .fix-form .work{ display:flex; flex-direction:column; gap:12px; }
  .fix-form .work[hidden], .fix-form .pick[hidden]{ display:none; }
  .fix-form .pick{ display:flex; flex-direction:column; gap:10px; }
  .pick-list{ display:flex; flex-direction:column; gap:6px; }
  .pick-item{ display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:48px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--text); font:inherit; font-size:15px; cursor:pointer; text-align:right; }
  .pick-item small{ color:var(--accent); font-size:12px; }
  .pick-none{ color:var(--text-dim); font-size:13px; padding:6px 2px; }
  .hint2{ font-size:12px; color:var(--text-dim); margin-bottom:6px; }
  .hint2.warn{ color:#7a4a00; }
  .qlist{ max-height:44dvh; overflow:auto; border:1px solid var(--line); border-radius:12px; background:#fff; padding:2px 10px; }
  .qsub{ font-weight:600; color:var(--green); font-size:13px; padding:10px 0 2px; }
  .qrow{ display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); }
  .qrow:last-child{ border-bottom:none; }
  .qrow .pre{ color:var(--text-dim); font-size:14px; }
  .qrow input{ width:92px; min-height:44px; text-align:center; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--text); padding:0 6px; }
  .qrow .rest{ flex:1; font-size:14px; }
  .qrow.plain .rest{ color:var(--text-dim); padding:8px 0; }
  .qrow.chg input{ border-color:var(--accent); background:#fff4f0; font-weight:600; }
  .qrow.bad input{ border-color:#c0392b; background:#fde8e3; }
  .fix-form input.bad{ border-color:#c0392b; background:#fde8e3; }
  .qcount{ margin-top:6px; font-size:13px; color:var(--accent); font-weight:500; }
  .prep-btn{ min-height:44px; padding:0 16px; border:1px solid var(--green); border-radius:999px; background:#fff; color:var(--green); font:inherit; font-size:14px; cursor:pointer; }
  .prep-btn.on{ background:var(--green); color:#fff; }
  .prep-badge{ display:inline-block; margin-inline-start:8px; padding:2px 9px; border-radius:999px; border:1px solid var(--green); color:var(--green); font-size:11px; font-weight:500; vertical-align:middle; }
  .prep-fab{ position:fixed; inset-inline-end:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:7; min-height:52px; padding:0 20px; border-radius:999px; border:none; background:#25a244; color:#fff; font:inherit; font-size:15px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.3); cursor:pointer; }
  body.has-timers .prep-fab{ bottom:calc(var(--timers-h, 100px) + 16px + env(safe-area-inset-bottom)); }
  .prow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .prow:last-child{ border-bottom:none; }
  .prow .pn{ flex:1 1 140px; font-weight:600; font-size:15px; }
  .prow .pq{ font-size:13px; color:var(--text-dim); flex:1 1 100%; }
  .prow input{ width:72px; min-height:44px; text-align:center; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:16px; background:#fff; color:var(--text); }
  .prow .pv{ display:flex; gap:6px; flex-wrap:wrap; }
  .prow .pv button{ min-height:40px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:#fff; font:inherit; font-size:13px; cursor:pointer; }
  .prow .pv button.on{ background:var(--green); color:#fff; border-color:var(--green); }
  .prow .px{ width:44px; height:44px; border:none; background:none; font-size:22px; color:#a3300f; cursor:pointer; }
  .padd{ display:flex; gap:8px; }
  .padd input{ min-width:0; }
  .fix-actions .wa{ background:#25a244; border-color:#25a244; color:#fff; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
  .yield{ white-space:pre-line; margin-top:14px; padding:10px 14px; border-radius:12px; background:var(--green); color:#fff; font-size:16px; font-weight:500; }
  .card-actions{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; }
  .cook-btn{ flex:1 1 100%; min-height:48px; border:none; border-radius:999px; background:var(--green); color:#fff; font:inherit; font-size:16px; font-weight:500; cursor:pointer; }
  .clear-btn{ min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--text-dim); font:inherit; font-size:13px; cursor:pointer; }
  li.tick{ cursor:pointer; padding:3px 0; }
  li.tick.done{ text-decoration:line-through; opacity:.45; }
  button:active{ transform:scale(.97); filter:brightness(.92); }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .alg{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; font-size:14px; }
  .alg b{ font-weight:600; color:#7a1d0a; }
  .alg-chip{ padding:3px 10px; border-radius:999px; background:#fde8e3; color:#7a1d0a; border:1px solid #f1b8a8; font-weight:500; }
  .alg.none{ font-size:13px; color:var(--text-dim); }
  small.nqs{ font-size:.8em; color:#8a5a00; }
  mark.nq{ background:#ffe58a; color:inherit; border-radius:4px; padding:0 3px; }
  .qwarn{ font-size:13px; color:#8a5a00; background:#fff4d6; border-radius:10px; padding:6px 10px; margin:0 0 10px; }
  li .uq{ color:#8a5a00; font-size:12px; margin-inline-start:6px; }
  .padd button{ min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:#fff; font:inherit; font-size:14px; cursor:pointer; }
  .tbtn.max{ border-style:dashed; }
  .tbtns{ display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px; }
  .tbtn{ min-height:44px; padding:0 14px; border:1px solid var(--green); border-radius:999px; background:#fff; color:var(--green); font:inherit; font-size:14px; cursor:pointer; }
  .tbtns.big .tbtn{ min-height:56px; font-size:18px; padding:0 20px; }
  .recent{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:0 0 10px; }
  .recent .lbl{ font-size:12px; color:var(--text-dim); }
  .rchip{ min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--text); font:inherit; font-size:13px; cursor:pointer; }
  .foot{ margin-top:22px; text-align:center; color:var(--text-dim); font-size:12px; }
  .foot-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
  .foot-btn{ min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--text-dim); font:inherit; font-size:13px; cursor:pointer; }
  .foot-help{ margin-top:10px; font-size:13px; color:var(--text); background:var(--green-soft); border-radius:12px; padding:10px 14px; }
  .timers{ position:fixed; inset-inline:0; bottom:0; z-index:30; display:flex; flex-direction:column; gap:6px; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--green); }
  .timers:empty{ display:none; }
  .cook-timers{ display:flex; flex-direction:column; gap:6px; background:var(--green); padding:0 12px; }
  .cook-timers:not(:empty){ padding:0 12px 8px; }
  .timer{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.14); color:#fff; border-radius:14px; padding:4px 6px 4px 14px; font-size:14px; }
  .timer .tl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .timer b{ font-size:20px; font-variant-numeric:tabular-nums; }
  .timer .tx{ min-width:44px; min-height:44px; border:none; border-radius:10px; background:rgba(255,255,255,.18); color:#fff; font-size:18px; cursor:pointer; }
  .timer.ring{ background:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.55; } }
  body.has-timers .app{ padding-bottom:calc(var(--timers-h, 100px) + 70px + env(safe-area-inset-bottom)); }
  body.has-timers .to-top{ bottom:calc(var(--timers-h, 100px) + 16px + env(safe-area-inset-bottom)); }
  dialog.cook{ border:none; padding:0; margin:0; width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; background:var(--cream); color:var(--text); }
  dialog.cook::backdrop{ background:var(--cream); }
  .cook-wrap{ display:flex; flex-direction:column; height:100dvh; position:relative; }
  .cook-top{ display:flex; align-items:center; gap:10px; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top)); background:var(--green); color:#fff; }
  .cook-top h2{ flex:1; margin:0; font-size:19px; font-weight:500; }
  .cook-close{ min-width:48px; min-height:48px; border:none; border-radius:12px; background:rgba(255,255,255,.16); color:#fff; font-size:22px; cursor:pointer; }
  .cook-prog{ height:6px; background:var(--green-soft); }
  .cook-prog i{ display:block; height:100%; background:var(--accent); transition:width .2s; }
  .cook-body{ flex:1; overflow:auto; padding:18px; font-size:26px; line-height:1.55; }
  .cook-body .step-no{ font-size:14px; color:var(--text-dim); margin-bottom:10px; }
  .cook-body .big-step{ font-size:28px; line-height:1.6; font-weight:500; }
  .cook-body ul{ margin:0; padding:0; list-style:none; font-size:22px; line-height:1.4; }
  .cook-body li{ padding:12px 4px; border-bottom:1px solid var(--line); }
  .cook-body li.sub{ margin:14px 0 0; border:none; color:var(--green); font-weight:600; font-size:18px; padding-bottom:2px; }
  .cook-body .yield{ margin:0 0 14px; font-size:18px; }
  .tick-step{ margin-top:22px; min-height:56px; padding:0 22px; border:1px solid var(--green); border-radius:999px; background:#fff; color:var(--green); font:inherit; font-size:18px; cursor:pointer; }
  .tick-step.done{ background:var(--green); color:#fff; }
  .cook-steps{ display:flex; gap:6px; overflow-x:auto; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); }
  .cook-steps button{ flex:0 0 auto; min-width:44px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:12px; background:#fff; font:inherit; font-size:15px; cursor:pointer; }
  .cook-steps button.on{ background:var(--green); color:#fff; border-color:var(--green); }
  .cook-steps button.dn{ border-color:var(--green); color:var(--green); }
  .cook-ing{ min-height:48px; padding:0 14px; border:none; border-radius:12px; background:rgba(255,255,255,.16); color:#fff; font:inherit; font-size:15px; cursor:pointer; }
  .cook-sheet{ position:absolute; inset:0; z-index:5; background:var(--cream); display:flex; flex-direction:column; }
  .cook-sheet[hidden]{ display:none; }
  .cook-sheet .cook-body{ font-size:22px; }
  .cook-note{ margin-top:18px; padding:12px 14px; border-radius:12px; background:#fff4d6; color:#5c3d00; font-size:18px; line-height:1.5; white-space:pre-line; }
  .cook-nav{ display:flex; gap:12px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--line); }
  .cook-nav button{ flex:1; min-height:68px; border-radius:18px; font:inherit; font-size:21px; border:1px solid var(--green); cursor:pointer; }
  .cook-nav .next{ background:var(--green); color:#fff; }
  .cook-nav .prev{ background:#fff; color:var(--green); }
  .cook-nav button:disabled{ opacity:.35; cursor:default; }
  .badge{ display:inline-block; margin-inline-start:8px; padding:2px 9px; border-radius:999px; background:var(--green); color:#fff; font-size:11px; font-weight:500; vertical-align:middle; }
  .card.is-current{ border-color:var(--green); box-shadow:inset -3px 0 0 var(--green); }
  .tab.current:not(.active){ color:var(--green); border-color:var(--green); }
  .card-head .cat{ font-size:12px; font-weight:400; color:var(--accent); margin-top:2px; }
  .chev{ color:var(--text-dim); transition:transform .2s; }
  .card.open .chev{ transform:rotate(180deg); }
  .card-body{ display:none; padding:0 18px 18px; border-top:1px solid var(--line); }
  .card.open .card-body{ display:block; }
  .card-body h3{ font-size:12px; font-weight:600; color:var(--green); letter-spacing:.1em; margin:16px 0 6px; }
  .card-body ul, .card-body ol{ margin:0; padding-inline-start:20px; line-height:1.75; font-size:15px; }
  .card-body li::marker{ color:var(--green); }
  .card-body li.sub{ list-style:none; margin:10px -20px 2px 0; font-weight:600; color:var(--green); font-size:14px; }
  .card-body li.sub::marker{ content:''; }
  .note{ white-space:pre-line; margin-top:14px; font-size:13px; color:var(--text-dim); background:var(--green-soft); border-radius:10px; padding:9px 12px; }

  .banner{ background:#fff4e0; border:1px solid #f0c27a; color:#7a4a00; border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:12px; }
  .to-top{ position:fixed; inset-inline-start:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:6; width:48px; height:48px; border-radius:50%; border:none; background:var(--green); color:#fff; font-size:20px; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; }
  .empty-note, .status{ text-align:center; color:var(--text-dim); font-size:14px; padding:26px 10px; border:1px dashed var(--line); border-radius:16px; }
  .status.error{ color:var(--accent); border-color:var(--accent); }
  /* מסך אישור מכשיר */
  .locked .app, .locked .timers, .locked .to-top{ display:none !important; }
  .gate{ max-width:560px; margin:0 auto; padding:22px 16px calc(40px + env(safe-area-inset-bottom)); }
  .gate[hidden]{ display:none; }
  .gate-box{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 18px; display:flex; flex-direction:column; gap:14px; }
  .gate h1{ font-size:22px; margin:0; color:var(--green); }
  .gate p{ margin:0; font-size:15px; line-height:1.6; }
  .gate input[type=text]{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; font-size:17px; min-height:48px; background:#fff; color:var(--text); }
  .gate input[type=text]:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .gate .code{ font-size:30px; font-weight:600; letter-spacing:.25em; color:var(--green); text-align:center; direction:ltr; background:var(--green-soft); border-radius:14px; padding:10px; }
  .gate button{ min-height:50px; border-radius:999px; border:1px solid var(--green); font:inherit; font-size:16px; font-weight:500; cursor:pointer; background:transparent; color:var(--green); }
  .gate button.primary{ background:var(--green); color:#fff; }
  .gate .hp{ position:absolute; inset-inline-start:-9999px; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
<header>
  <img src="./roberta-logo-white.svg" alt="Roberta Vinci">
  <div class="sub">ספר מתכונים</div>
</header>
<div class="gate" id="gate" hidden></div>
<div class="app">
  <div class="sticky">
    <input class="search" id="search" type="search" placeholder="חיפוש מתכון, מצרך או הערה..." autocomplete="off" enterkeyhint="search">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="recent" id="recent" hidden></div>
  <div id="list"><div class="status">טוען מתכונים...</div></div>
  <div class="foot" id="foot"></div>
</div>
<div class="timers" id="timers"></div>
<div class="sr" id="timer-announce" role="status" aria-live="assertive"></div>

<script src="recipes-lib.js"></script>
<script>
const { NUM, scaleAll, parseCSV, lines, fmtNum, toNum, scaleLine, scaleYield, yieldText, parseMultiplier, parseTable, queryTokens, searchScore, splitQuantities, hasUnscaledQty, findTimes, fmtDur } = RB;
// מקור המתכונים: טאב recipes בגיליון Google Sheets, דרך ה-Web App (apps-script/Code.gs) ורק למכשיר מאושר.
// המתכונים לא נמצאים בריפו. אם אין חיבור: העותק האחרון שנשמר במכשיר (עד 14 יום).
// הקריאה הישירה מהגיליון (gviz) נשארה רק לשרת ישן שלא מכיר את אישור המכשירים, ולא תעבוד כשהגיליון פרטי.
const USE_SHEET = true;
const SHEET_ID = '1H3tzII7pSwy0KS3UyI1gCcPn9ipNpVwAh8Mg1AqiilM';
const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=recipes`;
const CURRENT_TAB = 'תפריט נוכחי';
// כתובת ה-Web App של בקשות התיקון (Apps Script, ראו apps-script/Code.gs). ריק = הכפתור מוסתר.
const CORRECTION_URL = 'https://script.google.com/macros/s/AKfycbyT2q5HDJJ77nzPrpd-FayB1Mq5piCG6kLpP9Kx1zq-h4dbEYZPtgNK5JYG4WXv9xSj/exec';
// אישור מכשירים: הספר נטען דרך אותו Web App ורק מכשיר שאושר בטאב "מכשירים" מקבל מתכונים (ראו apps-script/Code.gs).
// GATE_ON = false או CORRECTION_URL ריק: הספר נטען כמו קודם, ישירות מהגיליון.
const GATE_ON = true;
const ACCESS_URL = CORRECTION_URL;
const OWNER_WA = '';    // מספר וואטסאפ של מי שמאשר, בפורמט 9725XXXXXXXX. ריק = המשתמש בוחר איש קשר בעצמו
const DEVICE_KEY = 'rb-device-v1';
const CATEGORIES = ['פס קר', 'פס חם', 'טאבון', "צ'קר", 'קונדיטוריה'];

// ---- מצב שנשמר במכשיר בלבד (לא משותף בין משתמשים) ----
const STORE_KEY = 'rb-state-v1', SHEET_CACHE_KEY = 'rb-sheet-v1', TTL = 12 * 3600e3;
const now = () => Date.now();
let state = (() => { try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); return s && typeof s === 'object' ? s : {}; }catch(e){ return {}; } })();
state.mult = state.mult || {}; state.variant = state.variant || {}; state.prog = state.prog || {}; state.recent = state.recent || []; state.timers = state.timers || []; state.prep = state.prep || {}; state.prepExtra = state.prepExtra || [];
if(state.wake === undefined) state.wake = true;
for(const k of Object.keys(state.mult)) if(!Array.isArray(state.mult[k]) || now() - state.mult[k][1] > TTL) delete state.mult[k];   // הכפלה פגה אחרי 12 שעות
for(const k of Object.keys(state.variant)) if(!Array.isArray(state.variant[k]) || now() - state.variant[k][1] > TTL) delete state.variant[k];   // בחירת גרסה פגה אחרי 12 שעות
for(const k of Object.keys(state.prep)) if(!state.prep[k] || now() - state.prep[k] > TTL) delete state.prep[k];   // רשימת הכנות פגה אחרי 12 שעות
state.prepExtra = state.prepExtra.filter(x => x && now() - x.ts <= TTL);
for(const k of Object.keys(state.prog)) if(!state.prog[k] || now() - state.prog[k].ts > TTL) delete state.prog[k];              // סימונים פגים אחרי 12 שעות
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
const getMult = key => (state.mult[key] && state.mult[key][0]) || 1;
function setMult(key, f){ if(f === 1) delete state.mult[key]; else state.mult[key] = [f, now()]; save(); }
// גרסאות כמות: מתכון שיש לו כמה גודלי אצווה (18 / 26 מנות). הבחירה נשמרת במכשיר בלבד.
function variantOf(r, key){
  if(!r.variants) return null;
  const sel = state.variant[key];
  return (sel && r.variants.find(v => v.label === sel[0])) || r.variants[0];
}
function setVariant(r, key, v){
  if(v === r.variants[0]) delete state.variant[key]; else state.variant[key] = [v.label, now()];
  save();
}
const NO_PROG = { ing: [], st: [], step: 0 };
const peek = key => state.prog[key] || NO_PROG;                       // קריאה בלבד, לא יוצרת רשומה
function prog(key){ return state.prog[key] || (state.prog[key] = { ts: now(), ing: [], st: [], step: 0 }); }
function toggleDone(key, kind, i){
  const p = prog(key), arr = p[kind], at = arr.indexOf(i);
  if(at < 0) arr.push(i); else arr.splice(at, 1);
  p.ts = now(); save(); return at < 0;
}

const openCards = new Set();        // כרטיסים פתוחים נשארים פתוחים בזמן חיפוש

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}

const SHEET_TIMEOUT_MS = 8000;

async function fetchText(url, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(url, { cache: 'no-store', signal: ctl.signal });
    return r.ok ? await r.text() : '';
  }finally{ clearTimeout(timer); }
}

function catRank(c){ const i = CATEGORIES.indexOf(c); return i < 0 ? CATEGORIES.length : i; }

let recipes = [];
let activeTab = 'הכל';
let dataInfo = { source: '', stamp: null };

function showBanner(msg){
  document.querySelector('.banner')?.remove();
  document.querySelector('.app').prepend(el('div', 'banner', msg));
}
const fmtStamp = ts => ts ? new Date(ts).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';

const EXTRA_CACHE_KEY = 'rb-extra-v1';
// מתכונים מהטאב recipes-extra בגיליון (לא נמצאים בטאב recipes). מתכון שקיים בגיליון באותה קטגוריה ובאותו שם גובר עליהם.
function mergeExtra(data, extraText){
  try{
    const extra = extraText && parseTable(extraText);
    if(!extra) return data;
    const have = new Set(data.map(keyOf));
    const add = extra.filter(r => !have.has(keyOf(r)));
    add.forEach((r, i) => { r.order = data.length + i; r.repoOnly = true; });      // לא קיימים בגיליון, ולכן אי אפשר לשלוח עליהם בקשת תיקון
    return data.concat(add);
  }catch(e){ return data; }
}
function applyData(data, source, stamp, first){
  dataInfo = { source, stamp };
  recipes = data;
  if(first && state.tab && (state.tab === 'הכל' || state.tab === CURRENT_TAB || recipes.some(r => r.cat === state.tab))) activeTab = state.tab;
  else if(!(activeTab === 'הכל' || activeTab === CURRENT_TAB || recipes.some(r => r.cat === activeTab))) activeTab = 'הכל';
  buildTabs(); renderRecent(); render(); refreshFooter();
}
// ---- אישור מכשיר ----
function deviceId(){
  try{
    let v = localStorage.getItem(DEVICE_KEY);
    if(RB.isDeviceId(v)) return v;
    v = RB.newDeviceId(crypto.getRandomValues(new Uint8Array(16)));
    localStorage.setItem(DEVICE_KEY, v);
    return v;
  }catch(e){ return ''; }
}
// text: התשובה הגולמית (ריקה = אין חיבור). acc: התשובה המפוענחת, או null אם זה לא JSON של הפרוטוקול (שרת ישן).
async function fetchAccess(){
  const id = deviceId();
  if(!id) return { acc: { status: 'nostorage' }, text: '' };
  let text = '';
  try{ text = await fetchText(`${ACCESS_URL}?a=data&d=${id}`, 12000); }catch(e){}
  return { acc: RB.parseAccess(text), text };
}
async function sendAccessRequest(name){
  try{
    const res = await fetch(ACCESS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'request', dev: deviceId(), name, website: document.getElementById('gate-hp')?.value || '' }) });
    const text = (await res.text()).trim();
    const acc = RB.parseAccess(text);
    return acc ? { acc } : { err: text };
  }catch(e){ return { err: 'network' }; }
}
const GATE_ERRORS = { network: 'אין חיבור לאינטרנט. נסו שוב.', busy: 'יש כרגע הרבה בקשות. נסו שוב בעוד כמה דקות.', invalid: 'כתבו את השם שלכם.', error: 'אירעה שגיאה. נסו שוב.' };
let gateTimer = 0, gateStatus = '';

function hideGate(){
  clearInterval(gateTimer); gateTimer = 0; gateStatus = '';
  document.body.classList.remove('locked');
  document.getElementById('gate').hidden = true;
}
// מנקה מהמכשיר את העותק השמור ומציג את המסך. נקרא כשהשרת אומר שהמכשיר לא מאושר.
function lockOut(acc){
  try{ localStorage.removeItem(SHEET_CACHE_KEY); localStorage.removeItem(EXTRA_CACHE_KEY); }catch(e){}
  recipes = [];
  for(const id of ['list', 'tabs', 'recent']) document.getElementById(id)?.replaceChildren();   // גם מה שכבר צויר מהעותק השמור
  showGate(acc);
}
async function recheckGate(){
  if(gateStatus === 'unknown' || gateStatus === 'nostorage') return;
  const { acc } = await fetchAccess();
  if(acc && acc.status === 'ok'){ hideGate(); load(); }
  else if(acc && acc.status !== gateStatus) showGate(acc);
  else if(!acc && gateStatus !== 'offline') showGate({ status: 'offline' });
}
function showGate(acc){
  const g = document.getElementById('gate');
  document.body.classList.add('locked');
  g.hidden = false;
  clearInterval(gateTimer); gateTimer = 0;
  gateStatus = acc.status;
  const box = el('div', 'gate-box');
  const msg = el('p'); msg.hidden = true; msg.setAttribute('role', 'alert'); msg.style.color = 'var(--accent)';
  const err = t => { msg.textContent = t; msg.hidden = false; };
  const btn = (label, cls, fn) => { const b = el('button', cls, label); b.type = 'button'; b.onclick = fn; return b; };
  if(acc.status === 'unknown'){
    box.append(el('h1', '', 'ספר המתכונים'), el('p', '', 'כדי לפתוח את הספר צריך אישור. כתבו את השם שלכם ולחצו על הבקשה, והיא תישלח למי שמאשר.'));
    const name = el('input'); name.type = 'text'; name.maxLength = 60; name.placeholder = 'השם שלך'; name.autocomplete = 'name'; name.setAttribute('aria-label', 'השם שלך');
    try{ name.value = localStorage.getItem('rb-sender') || ''; }catch(e){}
    const hp = el('input', 'hp'); hp.type = 'text'; hp.id = 'gate-hp'; hp.tabIndex = -1; hp.autocomplete = 'off'; hp.setAttribute('aria-hidden', 'true');
    const go = btn('בקש גישה', 'primary', async () => {
      const n = name.value.trim();
      if(!n){ err(GATE_ERRORS.invalid); name.focus(); return; }
      go.disabled = true; go.textContent = 'שולח...'; msg.hidden = true;
      const r = await sendAccessRequest(n);
      go.disabled = false; go.textContent = 'בקש גישה';
      if(r.acc){ try{ localStorage.setItem('rb-sender', n); }catch(e){} r.acc.status === 'ok' ? (hideGate(), load()) : showGate(r.acc); }
      else err(GATE_ERRORS[r.err] || GATE_ERRORS.error);
    });
    name.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); go.click(); } });
    box.append(name, hp, go, msg);
  }else if(acc.status === 'pending'){
    box.append(el('h1', '', 'הבקשה נשלחה'), el('p', '', (acc.name ? acc.name + ', ' : '') + 'ברגע שיאשרו אותך הספר ייפתח כאן לבד. אפשר להשאיר את הדף פתוח.'));
    if(acc.code){ box.append(el('p', '', 'הקוד שלך (כדי שיזהו אותך):'), el('div', 'code', acc.code)); }
    const wa = el('a'); wa.href = `https://wa.me/${OWNER_WA}?text=` + encodeURIComponent(`שלום, ביקשתי גישה לספר המתכונים.${acc.name ? ' שם: ' + acc.name + '.' : ''}${acc.code ? ' קוד: ' + acc.code : ''}`);
    wa.target = '_blank'; wa.rel = 'noopener'; wa.textContent = 'שלח הודעה בוואטסאפ לזרז אישור';
    wa.style.cssText = 'text-align:center;color:var(--green);font-size:15px;padding:10px;text-decoration:underline';
    box.append(btn('בדוק עכשיו', 'primary', async e => { e.target.textContent = 'בודק...'; await recheckGate(); if(gateStatus === 'pending'){ e.target.textContent = 'עדיין לא אושר'; setTimeout(() => { e.target.textContent = 'בדוק עכשיו'; }, 2500); } }), wa);
    gateTimer = setInterval(() => { if(document.visibilityState === 'visible') recheckGate(); }, 20000);
  }else if(acc.status === 'blocked'){
    box.append(el('h1', '', 'אין גישה'), el('p', '', 'הגישה לספר מהמכשיר הזה אינה פעילה. אם זו טעות, אפשר לפנות למי שמאשר.'), btn('בדוק שוב', 'primary', recheckGate));
  }else if(acc.status === 'nostorage'){
    box.append(el('h1', '', 'לא ניתן לשמור נתונים'), el('p', '', 'הדפדפן חוסם שמירה באתר (אולי גלישה פרטית). פתחו את הספר בחלון רגיל.'));
  }else{
    box.append(el('h1', '', 'אין חיבור'), el('p', '', 'כדי לאמת את המכשיר צריך להתחבר לאינטרנט. אחרי הכניסה הראשונה הספר עובד גם בלי קליטה.'), btn('נסה שוב', 'primary', recheckGate));
  }
  g.replaceChildren(box);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && gateStatus && gateStatus !== 'unknown') recheckGate(); });

// מציג מיד את העותק השמור במכשיר (אם יש), ובינתיים מרענן ברקע
async function load(){
  const list = document.getElementById('list');
  const gated = GATE_ON && !!ACCESS_URL;
  let cache = null, extraCached = null;
  if(USE_SHEET){
    try{ const c = JSON.parse(localStorage.getItem(SHEET_CACHE_KEY)); const d = parseTable(c.t); if(d) cache = { t: c.t, ts: c.ts, data: d }; }catch(e){}
  }
  if(gated && cache && !RB.cacheValid(cache.ts, now())) cache = null;       // עותק ישן מדי מוצג רק אחרי אימות מול השרת
  try{ extraCached = localStorage.getItem(EXTRA_CACHE_KEY); }catch(e){}
  let applied = false;
  if(cache){ applyData(mergeExtra(cache.data, extraCached), 'device', cache.ts, true); applied = true; restoreTimers(); }

  let acc = null, legacy = false;
  if(gated){
    const r = await fetchAccess();
    acc = r.acc;
    legacy = !acc && !!r.text;                                              // שרת ישן שלא מכיר את הפרוטוקול: טוענים כמו קודם
    if(acc && acc.status !== 'ok'){ lockOut(acc); return; }
    if(!acc && !legacy && !cache){ showGate({ status: 'offline' }); return; }
  }
  const direct = !gated || legacy;
  const extraP = Promise.resolve(acc ? acc.extra || '' : '');
  let data = null, source = '', stamp = null, t = '';
  if(acc){
    t = acc.csv || ''; data = parseTable(t);
    if(data){ source = 'sheet'; stamp = now(); try{ localStorage.setItem(SHEET_CACHE_KEY, JSON.stringify({ t, ts: stamp })); }catch(e){} }
  }else if(USE_SHEET && direct){
    try{
      t = await fetchText(SHEET_CSV_URL, SHEET_TIMEOUT_MS);
      data = parseTable(t);
      if(data){ source = 'sheet'; stamp = now(); try{ localStorage.setItem(SHEET_CACHE_KEY, JSON.stringify({ t, ts: stamp })); }catch(e){} }
    }catch(e){}
  }
  if(!data && cache){ data = cache.data; source = 'device'; stamp = cache.ts; }
  if(!data){
    if(!applied) list.replaceChildren(el('div', 'status error', 'לא הצלחתי לטעון את המתכונים. בדקו חיבור לאינטרנט ונסו לרענן.'));
    return;
  }
  const extraText = await extraP;
  if(extraText){ try{ localStorage.setItem(EXTRA_CACHE_KEY, extraText); }catch(e){} }
  if(source === 'device') showBanner('אין חיבור לשרת. מוצגת הגרסה האחרונה שנשמרה במכשיר' + (stamp ? ' (' + fmtStamp(stamp) + ')' : '') + '. הכמויות עשויות להיות לא מעודכנות.');
  else document.querySelector('.banner')?.remove();
  if(applied && source === 'device') return;                                   // כבר מוצג
  if(applied && source === 'sheet' && cache.t === t && (extraText || '') === (extraCached || '')){ dataInfo = { source, stamp }; refreshFooter(); return; }   // אין שינוי, לא בונים מחדש
  applyData(mergeExtra(data, extraText || extraCached), source, stamp, !applied);
  if(!applied) restoreTimers();
}

function buildTabs(){
  const tabs = document.getElementById('tabs');
  const extra = [...new Set(recipes.map(r => r.cat))].filter(c => c && !CATEGORIES.includes(c));
  // קטגוריה בלי מתכונים לא מוצגת. ברגע שמוסיפים לה מתכון בגיליון, הטאב מופיע מעצמו.
  const used = CATEGORIES.filter(c => recipes.some(r => r.cat === c));
  tabs.replaceChildren(...['הכל', CURRENT_TAB, ...used, ...extra].map(name => {
    const b = el('button', 'tab' + (name === activeTab ? ' active' : '') + (name === CURRENT_TAB ? ' current' : ''), name === CURRENT_TAB ? '★ ' + name : name);
    const n = name === 'הכל' ? recipes.length : name === CURRENT_TAB ? recipes.filter(r => r.current).length : recipes.filter(r => r.cat === name).length;
    b.append(el('span', 'n', String(n)));
    b.onclick = () => { activeTab = name; state.tab = name; save(); openCards.clear(); buildTabs(); render(); updateWake(); window.scrollTo({ top: 0 }); };
    return b;
  }));
}

function renderRecent(){
  const box = document.getElementById('recent');
  const items = state.recent.map(k => recipes.find(r => keyOf(r) === k)).filter(Boolean);
  const q = document.getElementById('search').value.trim();
  box.hidden = !items.length || !!q;
  if(box.hidden) return;
  box.replaceChildren(el('span', 'lbl', 'נצפו לאחרונה:'), ...items.map(r => {
    const b = el('button', 'rchip', r.title); b.type = 'button'; b.onclick = () => openRecipe(keyOf(r)); return b;
  }));
}
function pushRecent(key){
  state.recent = [key, ...state.recent.filter(k => k !== key)].slice(0, 6);
  save();
}
function openRecipe(key){
  const r = recipes.find(x => keyOf(x) === key); if(!r) return;
  activeTab = 'הכל'; state.tab = 'הכל'; document.getElementById('search').value = '';
  openCards.add(key); buildTabs(); render(); renderRecent(); updateWake();
  document.querySelector(`.card[data-key="${CSS.escape(key)}"]`)?.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

const keyOf = r => r.cat + '|' + r.title;

function render(){
  const tokens = queryTokens(document.getElementById('search').value);
  const inTab = r => activeTab === 'הכל' || (activeTab === CURRENT_TAB ? r.current : r.cat === activeTab);
  const rank = (a, b) => (b.score - a.score) || (b.r.current - a.r.current) || (catRank(a.r.cat) - catRank(b.r.cat)) || (a.r.order - b.r.order);
  const find = fuzzy => recipes.filter(inTab).map(r => ({ r, score: searchScore(r, tokens, fuzzy) })).filter(x => x.score > 0).sort(rank).map(x => x.r);
  let shown = find(false), fuzzy = false;
  if(!shown.length && tokens.length){ shown = find(true); fuzzy = shown.length > 0; }
  const list = document.getElementById('list');
  if(!shown.length){
    const empty = !tokens.length && activeTab !== 'הכל' && activeTab !== CURRENT_TAB;
    list.replaceChildren(el('div', 'empty-note', empty ? 'עוד אין מתכונים בקטגוריה "' + activeTab + '".' : activeTab !== 'הכל' && tokens.length ? 'לא נמצאו מתכונים בטאב הזה. נסו את הטאב "הכל".' : 'לא נמצאו מתכונים.'));
    return;
  }
  list.replaceChildren(...(fuzzy ? [el('div', 'empty-note', 'אין התאמה מדויקת. מוצגות תוצאות דומות:')] : []), ...shown.map(buildCard));
  syncPrep();
}

// שורות "תפוקה:" מוצגות בולט בראש המתכון, שאר ההערות בתחתית
const isYld = l => l.startsWith('תפוקה') || l.startsWith('מנות:');
const splitNote = note => { const ls = note.split('\n'); return { yld: ls.filter(isYld), rest: ls.filter(l => l && !isYld(l)).join('\n') }; };

// מסנכרן את כל השורות המסומנות והכפתורים "נקה סימונים" במסך לפי המצב השמור
function syncTicks(){
  document.querySelectorAll('[data-tick]').forEach(n => {
    const [cat, title, kind, i] = n.dataset.tick.split('|');
    const on = (state.prog[cat + '|' + title]?.[kind] || []).includes(+i);
    n.classList.toggle('done', on); n.setAttribute('aria-checked', on);
  });
  document.querySelectorAll('.clear-btn').forEach(b => { const p = peek(b.closest('.card').dataset.key); b.hidden = !(p.ing.length || p.st.length); });
}
// טקסט הוראה עם כמויות מפורשות מודגשות. כשיש הכפלה, ליד כל כמות מוצג החישוב אם הכמות הזו היא לכל האצווה
function qtyNodes(text, f){
  const out = [];
  splitQuantities(text, f).forEach(p => {
    if(!p.q){ out.push(document.createTextNode(p.t)); return; }
    out.push(el('mark', 'nq', p.t));
    if(p.s) out.push(el('small', 'nqs', ' (×' + fmtNum(f) + ': ' + p.s + ')'));
  });
  return out;
}
function tickList(tag, items, key, kind, f, scaler){
  const done = peek(key)[kind];
  const list = el(tag);
  items.forEach((text, i) => {
    if(text.endsWith(':') && kind === 'ing'){ list.append(el('li', 'sub', scaleAll(text, f))); return; }
    const li = el('li', 'tick' + (done.includes(i) ? ' done' : ''));
    const shown = scaler ? scaler(text, f) : text;
    if(f !== 1 && kind === 'st'){
      li.append(...qtyNodes(shown, f));      // כמות מפורשת בהוראה: לא מוכפלת אוטומטית, ולכן מודגשת עם החישוב לידה
    }else li.append(document.createTextNode(shown));
    if(f !== 1 && kind === 'ing' && hasUnscaledQty(text)){ const u = el('span', 'uq', '⚠ יש כאן כמות שלא הוכפלה'); li.append(u); }
    li.setAttribute('role', 'checkbox'); li.setAttribute('aria-checked', done.includes(i));
    li.onclick = () => { toggleDone(key, kind, i); syncTicks(); };
    li.dataset.tick = key + '|' + kind + '|' + i;
    list.append(li);
  });
  return list;
}

function buildCard(r){
  const key = keyOf(r);
  const card = el('div', 'card' + (r.current ? ' is-current' : '')); card.dataset.key = key;
  const head = el('button', 'card-head');
  const t = el('span'); t.append(el('div', '', r.title), el('div', 'cat', r.cat));
  if(r.current) t.firstChild.append(el('span', 'badge', '★ תפריט נוכחי'));
  const multTag = el('span', 'mult-tag'); multTag.hidden = true;
  t.firstChild.append(multTag);
  const prepTag = el('span', 'prep-badge', '✓ להכנה'); prepTag.dataset.prepTag = key; prepTag.hidden = !state.prep[key]; t.firstChild.append(prepTag);
  head.append(t, el('span', 'chev', '▾'));
  card.classList.toggle('open', openCards.has(key));
  head.setAttribute('aria-expanded', openCards.has(key));
  head.onclick = () => {
    const open = card.classList.toggle('open');
    head.setAttribute('aria-expanded', open);
    if(open){ openCards.add(key); pushRecent(key); card.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } else openCards.delete(key);
    updateWake();
  };
  const body = el('div', 'card-body');

  // בורר גרסה (כמות אצווה) או כלי הכפלה
  const bar = el('div', 'scale' + (r.variants ? ' var' : ''));
  let input = null, chips = [], vchips = [];
  if(r.variants){
    vchips = r.variants.map(v => {
      const c = el('button', 'chip', v.label); c.type = 'button';
      c.onclick = () => { setVariant(r, key, v); update(); };
      return c;
    });
    const row = el('div', 'chips'); row.append(...vchips);
    bar.append(el('label', '', 'כמות:'), row);
  }else{
    input = el('input'); input.type = 'text'; input.inputMode = 'decimal'; input.value = String(getMult(key));
    input.setAttribute('aria-label', 'מכפלה');
    chips = [0.5, 1, 2, 3].map(n => {
      const c = el('button', 'chip', n === 0.5 ? '½' : '×' + n); c.type = 'button';
      c.onclick = () => { input.value = String(n); update(); };
      return c;
    });
    const chipRow = el('div', 'chips'); chipRow.append(...chips);
    bar.append(el('label', '', 'כפול ×'), input, chipRow);
  }
  const hint = el('div', 'scale-hint');
  const actions = el('div', 'card-actions');
  const cook = el('button', 'cook-btn', '▶ מצב בישול'); cook.type = 'button'; cook.onclick = () => openCook(r, key);
  const clear = el('button', 'clear-btn', 'נקה סימונים'); clear.type = 'button';
  clear.onclick = () => { delete state.prog[key]; save(); syncTicks(); };
  const prepB = el('button', 'prep-btn'); prepB.type = 'button'; prepB.dataset.prep = key;
  prepB.onclick = () => { if(state.prep[key]) delete state.prep[key]; else state.prep[key] = now(); save(); syncPrep(); };
  actions.append(cook, prepB, clear);
  const dyn = el('div');
  const { yld, rest } = splitNote(r.note);
  function update(){
    const vr = variantOf(r, key);
    let f = 1;
    if(vr){
      vchips.forEach((c, i) => c.classList.toggle('on', r.variants[i] === vr));
      multTag.hidden = vr === r.variants[0]; multTag.textContent = vr.label;
      hint.textContent = '';
    }else{
      const k = parseMultiplier(input.value);
      const bad = k === null && input.value.trim() !== '';
      input.classList.toggle('bad', bad);
      f = k === null ? 1 : k;
      setMult(key, f);
      chips.forEach((c, i) => c.classList.toggle('on', f === [0.5, 1, 2, 3][i]));
      multTag.hidden = f === 1; multTag.textContent = '×' + fmtNum(f);
      hint.classList.toggle('bad', bad);
      hint.textContent = bad ? 'מספר לא תקין (אפשר למשל 1.5, ½ או 1/2). מוצגות הכמויות הרגילות.'
        : f === 1 ? '' : 'מוכפלת רק הכמות שבתחילת כל שורת מצרך (×' + fmtNum(f) + '). כמויות בתוך הוראות ההכנה (מסומנות בצהוב), אחוזים, מידות וזמנים לא משתנים, ולכן צריך לחשב אותן ידנית.';
    }
    const ings = vr ? vr.ingredients : r.ingredients;
    clear.hidden = !(peek(key).ing.length || peek(key).st.length);
    dyn.replaceChildren();
    if(yld.length) dyn.append(el('div', 'yield', yld.map(l => yieldText(l, f)).join('\n')));
    if(ings.length) dyn.append(el('h3', '', 'מצרכים'), tickList('ul', ings, key, 'ing', f, vr ? null : scaleLine));
    if(r.steps.length) dyn.append(el('h3', '', 'הכנה'), tickList('ol', r.steps, key, 'st', f, null));
    if(rest) dyn.append(el('div', 'note', rest));
    if(r.steps.some(s => findTimes(s).length)){
      dyn.querySelectorAll('ol li.tick').forEach((li, idx) => timerButtons(li, r, r.steps[idx]));
    }
  }
  if(input) input.addEventListener('input', () => { update(); });
  const alg = el('div', 'alg' + (r.allergens === null ? ' none' : ''));
  if(r.allergens === null) alg.textContent = 'אלרגנים: לא הוזנו למתכון הזה. העדר מידע לא אומר שאין אלרגנים.';
  else if(!r.allergens.length) alg.textContent = 'אלרגנים: ללא';
  else alg.append(el('b', '', 'אלרגנים:'), ...r.allergens.map(a => el('span', 'alg-chip', a)));
  body.append(bar, hint, alg, actions, dyn);
  update();

  if(CORRECTION_URL){
    if(r.repoOnly) body.append(el('div', 'note', 'המתכון הזה עוד לא בגיליון, ולכן אי אפשר לשלוח עליו בקשת תיקון מכאן. דווחו למנהל המטבח.'));
    else{
      const fix = el('button', 'fix-btn', 'בקשת תיקון למתכון'); fix.type = 'button';
      fix.onclick = () => openFix(r);
      body.append(fix);
    }
  }
  card.append(head, body);
  return card;
}

// ---- טיימרים ----
// טווח זמן ("40-60 דקות") נותן שני כפתורים: התחתון והעליון
function timerBtnPair(t){
  if(!t.max) return [['⏱ ' + t.label, t, '']];
  return [['⏱ ' + fmtDur(t.sec) + ' (מינימום)', { label: t.label + ' (מינימום)', sec: t.sec }, ''], ['⏱ ' + fmtDur(t.max) + ' (מקסימום)', { label: t.label + ' (מקסימום)', sec: t.max }, ' max']];
}
function timerButtons(host, r, stepText){
  const times = findTimes(stepText);
  if(!times.length) return;
  const row = el('div', 'tbtns');
  times.forEach(t => timerBtnPair(t).forEach(([lbl, tt, cls]) => {
    const b = el('button', 'tbtn' + cls, lbl); b.type = 'button';
    b.onclick = ev => { ev.stopPropagation(); startTimer(r.title, tt); };
    row.append(b);
  }));
  host.append(row);
}
let actx = null, tickHandle = null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); }catch(e){} }
function beep(){
  try{
    unlockAudio();
    [0, 0.35, 0.7].forEach(d => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d + 0.28);
      o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.3);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); }catch(e){}
}
function startTimer(title, t){
  unlockAudio();
  state.timers.push({ id: now() + Math.random(), label: title + ' · ' + t.label, end: now() + t.sec * 1000, fired: false });
  try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
  save(); renderTimers(); ensureTick(); updateWake();
}
function dismissTimer(id){
  state.timers = state.timers.filter(t => t.id !== id); save(); renderTimers(); updateWake();
}
function timerNode(t){
  const n = el('div', 'timer'); n.dataset.id = String(t.id);
  const tl = el('span', 'tl', t.label), b = el('b', '');
  const x = el('button', 'tx', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'סגירת טיימר'); x.onclick = () => dismissTimer(t.id);
  n.append(tl, b, x); n._b = b;
  return updateTimerNode(n, t);
}
function updateTimerNode(n, t){                       // מעדכן במקום, כדי שכפתור ✕ לא יוחלף באמצע לחיצה
  const left = (t.end - now()) / 1000, txt = left <= 0 ? 'הסתיים!' : fmtDur(left);
  if(n._b.textContent !== txt) n._b.textContent = txt;
  n.classList.toggle('ring', left <= 0);
  return n;
}
function renderTimers(){
  const hosts = [document.getElementById('timers'), ...document.querySelectorAll('.cook-timers')];
  hosts.forEach(h => {
    const have = new Map([...h.children].map(n => [n.dataset.id, n]));
    const nodes = state.timers.map(t => { const n = have.get(String(t.id)); return n ? updateTimerNode(n, t) : timerNode(t); });
    if(h.children.length !== nodes.length || nodes.some((n, k) => h.children[k] !== n)) h.replaceChildren(...nodes);
  });
  document.body.classList.toggle('has-timers', state.timers.length > 0);
}
function ensureTick(){
  if(tickHandle || !state.timers.length) return;
  tickHandle = setInterval(() => {
    let ringing = false;
    state.timers.forEach(t => {
      const left = t.end - now();
      if(left <= 0){ ringing = true; if(!t.fired){ t.fired = true; t.lastBeep = now(); save(); beep(); const a = document.getElementById('timer-announce'); if(a) a.textContent = 'הטיימר הסתיים: ' + t.label; } else if(now() - t.lastBeep > 4000 && now() - t.end < 60000){ t.lastBeep = now(); beep(); } }
    });
    document.title = ringing ? '⏰ טיימר הסתיים' : 'ספר מתכונים';
    renderTimers();
    if(!state.timers.length){ clearInterval(tickHandle); tickHandle = null; document.title = 'ספר מתכונים'; }
  }, 500);
}
try{ const tb = document.getElementById('timers'); new ResizeObserver(() => document.documentElement.style.setProperty('--timers-h', tb.offsetHeight + 'px')).observe(tb); }catch(e){}
function restoreTimers(){ state.timers = state.timers.filter(t => now() - t.end < 3600e3); renderTimers(); ensureTick(); updateWake(); }

// ---- מצב בישול: שלב אחד בכל פעם, טקסט גדול ----
function openCook(r, key){
  const vr = variantOf(r, key), f = vr ? 1 : getMult(key), steps = r.steps, total = steps.length + 1;     // 0 = מצרכים
  const ings = vr ? vr.ingredients : r.ingredients;
  let i = Math.min(peek(key).step || 0, total - 1);
  const dlg = document.createElement('dialog'); dlg.className = 'cook';
  const wrap = el('div', 'cook-wrap');
  const top = el('div', 'cook-top');
  const title = el('h2', '', r.title + (vr ? '  ·  ' + vr.label : f !== 1 ? '  ×' + fmtNum(f) : ''));
  const close = el('button', 'cook-close', '✕'); close.type = 'button'; close.setAttribute('aria-label', 'סגירה'); close.onclick = () => dlg.close();
  const ingBtn = el('button', 'cook-ing', 'מצרכים'); ingBtn.type = 'button';
  top.append(title, ingBtn, close);
  const timersBox = el('div', 'cook-timers');
  const barWrap = el('div', 'cook-prog'), barFill = el('i'); barWrap.append(barFill);
  const body = el('div', 'cook-body');
  const nav = el('div', 'cook-nav');
  const prev = el('button', 'prev', '‹ הקודם'), next = el('button', 'next', 'הבא ›');
  prev.type = next.type = 'button';
  nav.append(prev, next);
  const stepBar = el('div', 'cook-steps');
  const sheet = el('div', 'cook-sheet'); sheet.hidden = true;
  const sheetBody = el('div', 'cook-body'), sheetClose = el('button', 'cook-nav-close', 'חזרה לשלב'); sheetClose.type = 'button';
  sheetClose.style.cssText = 'margin:12px 16px calc(12px + env(safe-area-inset-bottom));min-height:60px;border:none;border-radius:16px;background:var(--green);color:#fff;font:inherit;font-size:20px;cursor:pointer';
  sheet.append(sheetBody, sheetClose);
  wrap.append(top, timersBox, barWrap, stepBar, body, nav, sheet); dlg.append(wrap);
  const { yld, rest } = splitNote(r.note);
  const ingList = () => tickList('ul', ings, key, 'ing', f, vr ? null : scaleLine);
  ingBtn.onclick = () => {                              // מצרכים זמינים מכל שלב
    sheetBody.replaceChildren(el('div', 'step-no', 'מצרכים' + (f !== 1 ? ' · ×' + fmtNum(f) : '')));
    if(yld.length) sheetBody.append(el('div', 'yield', yld.map(l => yieldText(l, f)).join('\n')));
    sheetBody.append(ingList()); sheet.hidden = false;
  };
  sheetClose.onclick = () => { sheet.hidden = true; syncTicks(); };
  const stepBtns = Array.from({ length: total }, (_, k) => {
    const b = el('button', '', k === 0 ? 'מצרכים' : String(k)); b.type = 'button'; b.setAttribute('aria-label', k === 0 ? 'מצרכים' : 'שלב ' + k);
    b.onclick = () => { i = k; show(); }; return b;
  });
  stepBar.append(...stepBtns);
  function show(){
    const p = prog(key); p.step = i; p.ts = now(); save();
    barFill.style.width = (i / (total - 1 || 1) * 100) + '%';
    prev.disabled = i === 0;
    next.textContent = i === total - 1 ? 'סיום ✓' : 'הבא ›';
    stepBtns.forEach((b, k) => { b.classList.toggle('on', k === i); b.classList.toggle('dn', k > 0 && peek(key).st.includes(k - 1)); });
    stepBtns[i].scrollIntoView({ block: 'nearest', inline: 'center' });
    body.replaceChildren();
    if(i === 0){
      body.append(el('div', 'step-no', 'מצרכים' + (steps.length ? ' · ' + steps.length + ' שלבים' : '')));
      if(yld.length) body.append(el('div', 'yield', yld.map(l => yieldText(l, f)).join('\n')));
      body.append(ingList());
      if(rest) body.append(el('div', 'cook-note', rest));
    }else{
      body.append(el('div', 'step-no', 'שלב ' + i + ' מתוך ' + steps.length));
      const s = el('div', 'big-step');
      const parts = f !== 1 ? splitQuantities(steps[i - 1], f) : [];
      if(f !== 1) s.append(...qtyNodes(steps[i - 1], f)); else s.textContent = steps[i - 1];
      body.append(s);
      if(parts.some(p => p.q)) body.append(el('div', 'qwarn', '⚠ הכפלת ×' + fmtNum(f) + ': הכמות המסומנת בצהוב לא הוכפלה אוטומטית. בסוגריים החישוב אם היא לכל האצווה. את זה קובע השף.'));
      const times = findTimes(steps[i - 1]);
      if(times.length){ const row = el('div', 'tbtns big'); times.forEach(t => timerBtnPair(t).forEach(([lbl, tt, cls]) => { const b = el('button', 'tbtn' + cls, lbl); b.type = 'button'; b.onclick = () => startTimer(r.title, tt); row.append(b); })); body.append(row); }
      const isDone = peek(key).st.includes(i - 1);
      const cur = el('button', 'tick-step' + (isDone ? ' done' : ''), isDone ? '✓ בוצע' : 'סמן כבוצע'); cur.type = 'button';
      cur.onclick = () => { const on = toggleDone(key, 'st', i - 1); cur.classList.toggle('done', on); cur.textContent = on ? '✓ בוצע' : 'סמן כבוצע'; syncTicks(); };
      body.append(cur);
      if(i === total - 1 && rest) body.append(el('div', 'cook-note', rest));
    }
    body.scrollTop = 0;
  }
  prev.onclick = () => { if(i > 0){ i--; show(); } };
  next.onclick = () => { if(i < total - 1){ i++; show(); } else dlg.close(); };
  let x0 = null;
  dlg.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener('touchend', e => { if(x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 70) (dx < 0 ? next : prev).click(); }, { passive: true });
  dlg.addEventListener('keydown', e => { if(e.key === 'ArrowLeft') next.click(); else if(e.key === 'ArrowRight') prev.click(); });
  dlg.addEventListener('close', () => { dlg.remove(); syncTicks(); updateWake(); });
  document.body.append(dlg); dlg.showModal(); pushRecent(key); show(); renderTimers(); updateWake();
}

// ---- מסך ער ----
let wl = null;
async function updateWake(){
  const want = state.wake && (openCards.size > 0 || document.querySelector('dialog.cook[open]') || state.timers.length > 0);
  if(want && !wl && 'wakeLock' in navigator && document.visibilityState === 'visible'){
    try{ const l = await navigator.wakeLock.request('screen'); wl = l; l.addEventListener('release', () => { if(wl === l) wl = null; refreshFooter(); }); }catch(e){}
  }else if(!want && wl){
    const l = wl; wl = null; try{ await l.release(); }catch(e){}
  }
  refreshFooter();
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ updateWake(); renderTimers(); } });

// ---- תחתית: מקור הנתונים, מסך ער והתקנה ----
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });

    w.onclick = () => { state.wake = !state.wake; save(); updateWake(); };

  }

    const a = el('button', 'foot-btn', '📲 הוסף למסך הבית'); a.type = 'button';

// ---- בקשת תיקון ----
// נבחר מתכון ספציפי (מתוך הכרטיס, או מהכפתור הכללי עם בורר). שני סוגי תיקון:
//  1. כמויות: שדה לכל מצרך, משנים רק את המספר. 2. הוראות הכנה: עריכת טקסט חופשי.
const FIX_REPLIES = {
  ok: ['נשלחה', false],
  same: ['הנוסח זהה לנוסח שכבר בספר', true],
  unknown: ['המתכון לא נמצא בגיליון (אולי שמו שונה). רעננו את הדף ונסו שוב', true],
  invalid: ['הבקשה לא תקינה', true],
  busy: ['יש כרגע הרבה בקשות. נסו שוב בעוד כמה דקות', true],
  denied: ['המכשיר הזה לא מאושר לשליחת תיקונים. רעננו את הדף ובקשו אישור', true],
  error: ['אירעה שגיאה בשמירה', true]
};
const QTY_RE = new RegExp(String.raw`^((?:תפוקה:\s*)?(?:כ-|ל-|ל)?)((?:${NUM})(?:\s*-\s*(?:${NUM}))?|חצי|רבע|שליש)(?=\s|$)(.*)$`);
const QTY_OK = new RegExp(String.raw`^(?:(?:${NUM})(?:\s*-\s*(?:${NUM}))?|חצי|רבע|שליש)$`);
const splitQty = line => { const m = line.match(QTY_RE); return m ? { pre: m[1], qty: m[2], rest: m[3] } : null; };

async function postRequest(body){
  try{
    const res = await fetch(CORRECTION_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, dev: deviceId() }) });
    return (await res.text()).trim();
  }catch(e){ return null; }
}

function openFix(preset){
  let r = preset || null, mode = 'qty', sent = false;
  const dlg = document.createElement('dialog'); dlg.className = 'fix';
  const form = el('form', 'fix-form'); form.noValidate = true;
  const msg = el('div'); msg.hidden = true;
  const say = (text, err) => { msg.className = 'fix-msg' + (err ? ' err' : ''); msg.textContent = text; msg.hidden = false; msg.scrollIntoView({ block: 'nearest' }); };

  // 1. בורר מתכון
  const pick = el('div', 'pick');

  const pickList = el('div', 'pick-list');
  const fillPick = () => {
    const tokens = queryTokens(pickIn.value);
    const hits = recipes.filter(x => !x.repoOnly).map(x => ({ x, s: searchScore({ title: x.title, cat: x.cat, ingredients: [], steps: [], note: '' }, tokens) })).filter(o => o.s > 0).sort((a, b) => b.s - a.s).map(o => o.x).slice(0, 8);

  // 2. אזור העבודה
  const work = el('div', 'work');
  const chosen = el('div', 'chosen');
  const seg = el('div', 'seg');
  const bQty = el('button', 'on', 'כמויות'), bTxt = el('button', '', 'הוראות הכנה'), bYld = el('button', '', 'תפוקה');
  bQty.type = bTxt.type = bYld.type = 'button'; seg.append(bQty, bTxt, bYld);
  const pQty = el('div', 'panel'), pTxt = el('div', 'panel'), pYld = el('div', 'panel'); pTxt.hidden = true; pYld.hidden = true;
  const setMode = m => { mode = m; bQty.classList.toggle('on', m === 'qty'); bTxt.classList.toggle('on', m === 'txt'); bYld.classList.toggle('on', m === 'yld'); pQty.hidden = m !== 'qty'; pTxt.hidden = m !== 'txt'; pYld.hidden = m !== 'yld'; };
  bQty.onclick = () => setMode('qty'); bTxt.onclick = () => setMode('txt'); bYld.onclick = () => setMode('yld');
  const comment = el('input'); comment.type = 'text'; comment.maxLength = 300; comment.placeholder = 'מה לא נכון? (לא חובה)';
  const sender = el('input'); sender.type = 'text'; sender.maxLength = 60; sender.placeholder = 'השם שלך (חובה)'; sender.required = true;
  try{ sender.value = localStorage.getItem('rb-sender') || ''; }catch(e){}
  const hp = el('input', 'hp'); hp.type = 'text'; hp.tabIndex = -1; hp.autocomplete = 'off'; hp.setAttribute('aria-hidden', 'true');
  const l3 = el('label', '', 'הערה'); l3.append(comment);
  sender.addEventListener('input', () => sender.classList.remove('bad'));
  const l4 = el('label', '', 'שם המבקש (חובה)'); l4.append(sender);
  work.append(chosen, seg, pQty, pTxt, pYld, l3, l4, hp);
  work.hidden = true;

  let qrows = [], txt = null, yin = null, pin = null, yIdx = -1, yBase = '', pIdx = -1, pBase = '';
  function choose(x){
    r = x; pick.hidden = true; work.hidden = false; send.hidden = false; msg.hidden = true;
    bQty.hidden = !!r.variants;                                       // מתכון עם גרסאות כמות: תיקון כמויות אצל השף בלבד
    chosen.replaceChildren(el('div', 'ct', r.title), el('small', '', r.cat));
    if(!preset){ const sw = el('button', 'swap', 'החלפה'); sw.type = 'button'; sw.onclick = () => { work.hidden = true; send.hidden = true; pick.hidden = false; pickIn.focus(); }; chosen.append(sw); }
    // כמויות: שדה לכל מצרך שיש לו כמות בתחילת השורה
    pQty.replaceChildren(el('div', 'hint2', 'הכמויות כפי שהן בספר (בלי הכפלה). משנים רק את המספר.'));
    const box = el('div', 'qlist');
    qrows = (r.variants ? [] : r.ingredients).map((line, idx) => {
      if(line.endsWith(':')){ box.append(el('div', 'qsub', line)); return null; }
      const s = splitQty(line), row = el('div', 'qrow');
      if(!s){ row.append(el('span', 'rest', line)); row.classList.add('plain'); box.append(row); return null; }
      const inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.value = s.qty; inp.setAttribute('aria-label', 'כמות: ' + line);
      const q = { s, inp, idx, row };
      inp.addEventListener('input', () => { const v = inp.value.trim(); row.classList.toggle('chg', v !== s.qty); row.classList.remove('bad'); count(); });
      row.append(...(s.pre ? [el('span', 'pre', s.pre)] : []), inp, el('span', 'rest', s.rest.trim()));
      box.append(row); return q;
    }).filter(Boolean);
    if(!r.ingredients.length) box.append(el('div', 'pick-none', 'אין מצרכים במתכון הזה'));
    const cnt = el('div', 'qcount'); cnt.hidden = true;
    function count(){ const n = qrows.filter(q => q.inp.value.trim() !== q.s.qty).length; cnt.hidden = !n; cnt.textContent = n + ' שינויים'; }
    pQty.append(box, cnt);
    // הוראות הכנה
    txt = el('textarea'); txt.value = r.raw['הוראות הכנה'] || '';
    pTxt.replaceChildren(el('div', 'hint2', 'עריכה חופשית. כל שורה היא שלב.'), txt);
    if(!r.steps.length) pTxt.prepend(el('div', 'hint2 warn', 'למתכון הזה אין עדיין הוראות הכנה, אפשר לכתוב אותן כאן.'));
    // תפוקה: שורה "תפוקה: ..." בתוך עמודת ההערות. משנים רק אותה ושאר ההערות נשארות כמות שהן
    const noteLines = (r.raw['הערות'] || '').replace(/\r/g, '').split('\n');
    yIdx = noteLines.findIndex(l => l.trim().startsWith('תפוקה'));
    yBase = yIdx >= 0 ? noteLines[yIdx].trim().replace(/^תפוקה:?\s*/, '') : '';
    pIdx = noteLines.findIndex(l => l.trim().startsWith('מנות:'));
    pBase = pIdx >= 0 ? noteLines[pIdx].trim().replace(/^מנות:\s*/, '') : '';
    yin = el('input'); yin.type = 'text'; yin.maxLength = 120; yin.value = yBase; yin.placeholder = 'למשל: 27 ק"ג בצק';
    yin.addEventListener('input', () => yin.classList.remove('bad'));
    pin = el('input'); pin.type = 'text'; pin.maxLength = 120; pin.value = pBase; pin.placeholder = 'למשל: 100 (270 גרם למנה)';
    pin.addEventListener('input', () => pin.classList.remove('bad'));
    const ly = el('label', '', 'תפוקה (כמות)'); ly.append(yin);
    const lp = el('label', '', 'כמה מנות יוצאות (מספר, ואפשר גם משקל למנה בסוגריים)'); lp.append(pin);
    pYld.replaceChildren(el('div', 'hint2', yIdx >= 0 || pIdx >= 0 ? 'כפי שהם בספר. אפשר לשנות כל אחד.' : 'למתכון הזה אין עדיין תפוקה או מספר מנות, אפשר להוסיף כאן.'), ly, lp);
    setMode(r.ingredients.length && !r.variants ? 'qty' : 'txt');
  }

  const send = el('button', 'send', 'שליחה לאישור'); send.type = 'submit'; send.hidden = true;
  const cancel = el('button', 'cancel', 'ביטול'); cancel.type = 'button';
  const actions = el('div', 'fix-actions'); actions.append(send, cancel);
  form.append(el('h2', '', 'בקשת תיקון'), pick, work, msg, actions);
  dlg.append(form);

  const dirty = () => !sent && r && (qrows.some(q => q.inp.value.trim() !== q.s.qty) || (txt && txt.value.trim() !== (r.raw['הוראות הכנה'] || '').trim()) || (yin && (yin.value.trim() !== yBase || pin.value.trim() !== pBase)) || comment.value.trim());
  const tryClose = () => { if(!dirty() || confirm('לסגור בלי לשלוח? מה שכתבת יימחק.')) dlg.close(); };
  cancel.onclick = tryClose;
  dlg.addEventListener('cancel', ev => { ev.preventDefault(); tryClose(); });   // ESC
  dlg.addEventListener('click', ev => { if(ev.target === dlg) tryClose(); });

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    if(!r) return;
    const reqs = [];
    // כמויות
    const changed = qrows.filter(q => q.inp.value.trim() !== q.s.qty);
    const badRows = changed.filter(q => !QTY_OK.test(q.inp.value.trim()));
    if(badRows.length){ badRows.forEach(q => q.row.classList.add('bad')); setMode('qty'); say('יש כמות שאינה מספר תקין. אפשר מספר (למשל 350 או 1.5), טווח (60-75) או חצי/רבע/שליש.', true); badRows[0].inp.focus(); return; }
    if(changed.length){
      const lines = r.ingredients.slice();
      changed.forEach(q => { lines[q.idx] = q.s.pre + q.inp.value.trim() + q.s.rest; });
      reqs.push({ field: 'מצרכים', base: r.raw['מצרכים'] || '', proposed: lines.join('\n') });
    }
    // הוראות הכנה
    const t = txt ? txt.value.trim() : '';
    if(txt && t && t !== (r.raw['הוראות הכנה'] || '').trim()) reqs.push({ field: 'הוראות הכנה', base: r.raw['הוראות הכנה'] || '', proposed: t });
    // תפוקה ומספר מנות (שתי שורות בתוך עמודת ההערות)
    const yv = yin ? yin.value.trim() : '', pv = pin ? pin.value.trim() : '';
    const yChg = yin && yv && yv !== yBase, pChg = pin && pv && pv !== pBase;
    const vErr = (pChg && RB.validatePortions(pv)) || (yChg && RB.validateYield(yv));
    if(vErr){ say(vErr, true); (pChg && RB.validatePortions(pv) ? pin : yin).classList.add('bad'); (pChg && RB.validatePortions(pv) ? pin : yin).focus(); return; }
    if(yChg || pChg){
      let ls = (r.raw['הערות'] || '').replace(/\r/g, '').split('\n');
      const at = (pref, val) => {
        const i = ls.findIndex(l => l.trim().startsWith(pref));
        if(i >= 0) ls[i] = pref + ' ' + val;
        else if(pref === 'מנות:' && ls.findIndex(l => l.trim().startsWith('תפוקה')) >= 0) ls.splice(ls.findIndex(l => l.trim().startsWith('תפוקה')) + 1, 0, pref + ' ' + val);
        else ls.unshift(pref + ' ' + val);
      };
      if(pChg) at('מנות:', pv);
      if(yChg) at('תפוקה:', yv);                                       // תפוקה נשארת מעל המנות
      reqs.push({ field: 'הערות', base: r.raw['הערות'] || '', proposed: ls.join('\n').replace(/\n+$/, '') });
    }
    if(!reqs.length){ say('לא בוצע שום שינוי.', true); return; }
    if(!sender.value.trim()){ say('חובה לכתוב את השם שלך כדי לשלוח בקשה.', true); sender.classList.add('bad'); sender.focus(); return; }
    try{ localStorage.setItem('rb-sender', sender.value.trim()); }catch(e){}
    send.disabled = true; msg.hidden = true;
    const results = [];
    for(const q of reqs){
      const a = await postRequest({ cat: r.cat, title: r.title, ...q, comment: comment.value.trim(), sender: sender.value.trim(), website: hp.value });
      results.push({ field: q.field, reply: a === null ? null : (FIX_REPLIES[a] ? a : 'error') });
    }
    const lost = results.filter(x => x.reply === null), bad = results.filter(x => x.reply && x.reply !== 'ok');
    if(lost.length){ say('לא הצלחתי לוודא שהבקשה נשמרה. בדקו חיבור ונסו לשלוח שוב (בקשה כפולה לא תירשם פעמיים).', true); send.disabled = false; return; }
    if(bad.length){ say(bad.map(x => x.field + ': ' + FIX_REPLIES[x.reply][0]).join('\n'), true); send.disabled = false; return; }
    sent = true; send.hidden = true; cancel.textContent = 'סגירה';
    say(reqs.length === 1 ? 'הבקשה נשלחה וממתינה לאישור. תודה!' : 'נשלחו ' + reqs.length + ' בקשות וממתינות לאישור. תודה!', false);
  });
  dlg.addEventListener('close', () => dlg.remove());
  document.body.append(dlg); dlg.showModal();
  if(preset) choose(preset); else { fillPick(); pickIn.focus(); }
}


// ---- רשימת הכנות לשליחה בוואטסאפ ----
// הטבח מסמן "להכנה היום" בכרטיס מתכון, הכמות היא ההכפלה/הגרסה שנבחרה, ואפשר להוסיף פריטים שלא בספר.
function syncPrep(){
  document.querySelectorAll('[data-prep]').forEach(b => { const on = !!state.prep[b.dataset.prep]; b.classList.toggle('on', on); b.textContent = on ? '✓ ברשימת ההכנות' : '＋ להכנה היום'; });
  document.querySelectorAll('[data-prep-tag]').forEach(b => { b.hidden = !state.prep[b.dataset.prepTag]; });
  const n = Object.keys(state.prep).filter(k => recipes.some(r => keyOf(r) === k)).length + state.prepExtra.length;
  let fab = document.getElementById('prepFab');
  if(!fab){ fab = el('button', 'prep-fab'); fab.id = 'prepFab'; fab.type = 'button'; fab.onclick = openPrep; document.body.append(fab); }
  fab.hidden = n === 0; fab.textContent = '📋 רשימת הכנות (' + n + ')';
}
function prepInfo(r){
  const key = keyOf(r), vr = variantOf(r, key), f = vr ? 1 : getMult(key);
  const { yld } = splitNote(r.note);
  const mult = vr ? vr.label : f !== 1 ? '×' + fmtNum(f) : '';
  const y = yld.map(l => yieldText(l, f)).join(', ');
  return { mult, y, line: '• ' + r.title + (mult ? ' ' + mult : '') + (y ? ' — ' + y : '') };
}
function prepMessage(name, note){
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  const out = ['*רשימת הכנות*', 'שם: ' + name, 'תאריך: ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()), ''];
  recipes.filter(r => state.prep[keyOf(r)]).forEach(r => out.push(prepInfo(r).line));
  state.prepExtra.forEach(x => out.push('• ' + x.name + (x.qty ? ' — ' + x.qty : '')));
  if(note) out.push('', 'הערה: ' + note);
  return out.join('\n');
}

    const name = nm.value.trim();
    const n = recipes.filter(r => state.prep[keyOf(r)]).length + state.prepExtra.length;
    if(!n){ say('הרשימה ריקה.', true); return; }
    if(!name){ say('חובה לכתוב את השם שלך.', true); nm.classList.add('bad'); nm.focus(); return; }
    try{ localStorage.setItem('rb-sender', name); }catch(e){}
    const url = 'https://wa.me/?text=' + encodeURIComponent(prepMessage(name, note.value.trim()));
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.append(a); a.click(); a.remove();
    say('וואטסאפ נפתח עם ההודעה. בוחרים למי לשלוח ולוחצים שליחה.', false);
  });
  dlg.addEventListener('close', () => { dlg.remove(); render(); });
  dlg.append(form); document.body.append(dlg); dlg.showModal();
}

// ---- אתחול ----
document.getElementById('search').addEventListener('input', () => { render(); renderRecent(); });
const toTop = el('button', 'to-top', '↑'); toTop.type = 'button'; toTop.hidden = true; toTop.setAttribute('aria-label', 'חזרה למעלה');
toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
document.body.append(toTop);
window.addEventListener('scroll', () => { toTop.hidden = window.scrollY < 600; }, { passive: true });
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./recipes-sw.js', { scope: './recipes.html' }).catch(() => {}));
}
// קישור עמוק מאפליקציית המלאי: recipes.html#q=שם מתכון. ממלא את החיפוש ומציג את כל הקטגוריות.
function applyHashQuery(){
  try{
    const m = location.hash.match(/^#q=(.*)$/);
    if(!m) return;
    document.getElementById('search').value = decodeURIComponent(m[1]).slice(0, 80);
    activeTab = 'הכל'; state.tab = 'הכל';
    if(recipes.length){ buildTabs(); render(); renderRecent(); }
  }catch(e){}
}
applyHashQuery();
window.addEventListener('hashchange', applyHashQuery);
load();
</script>
