name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: אין קובצי נתונים בריפו הציבורי
        run: test -z "$(git ls-files '*.csv')" || (git ls-files '*.csv'; echo 'קובצי CSV אסורים בריפו'; exit 1)
      - run: npm run check
      - name: תחביר ה-JavaScript של recipes.html
        run: |
          node -e "
          const h=require('fs').readFileSync('recipes.html','utf8');
          const m=h.match(/<script>\n([\s\S]*)<\/script>\n<\/body>/);
          if(!m) throw new Error('לא נמצא בלוק script');
          new Function(m[1]);
          console.log('syntax ok');"
