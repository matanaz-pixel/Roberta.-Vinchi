<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ספר מנות | רוברטה וינצ'י</title>
<meta name="theme-color" content="#023305">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../roberta-logo.png">
<link rel="manifest" href="menu.webmanifest">
<link rel="apple-touch-icon" href="../roberta-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ספר מנות">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  /* דף אחד ארוך: כל המנות לפי הסדר, כל הפרטים גלויים. אין פתיחה ואין מעבר בין מסכים. */
  :root{
    --green:#023305; --green-soft:#e6efe6; --cream:#fbf8f2; --card:#fff;
    --line:#e9e3d6; --text:#1d2a1e; --text-dim:#5b665b; --accent:#ef4823; --gold:#b8a06a;
    --accent-soft:#fde8e2; --gold-soft:#f4ecd6;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;scroll-padding-top:128px;}
  html,body{margin:0;background:var(--cream);color:var(--text);font-family:'Rubik',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  button,input{font-family:inherit;font-size:16px;color:inherit;}
  button{cursor:pointer;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  .app{max-width:720px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom));}

  header.top{background:var(--green);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top));}
  header.top img{height:28px;width:auto;}
  header.top .sub{font-size:13px;letter-spacing:.16em;color:#cfe0cf;flex:1;}

  .sticky{position:sticky;top:0;z-index:5;background:var(--cream);box-shadow:0 1px 0 var(--line);}
  .rowbar{display:flex;gap:8px;align-items:center;padding:10px 16px;}
  #cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;}
  #cats::-webkit-scrollbar{display:none;}
  .chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--text-dim);min-height:42px;border-radius:999px;padding:6px 18px;font-size:15px;white-space:nowrap;}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;}
  .chip.small{min-height:38px;font-size:14px;padding:5px 14px;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}

  #status{background:var(--gold-soft);color:#6b5a2b;padding:10px 16px;font-size:14px;}
  section.cat h2.cat-title{font-size:24px;font-weight:600;color:var(--green);margin:28px 16px 12px;}
  article.dish{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:0 16px 18px;}
  .hero{display:block;width:100%;height:auto;max-height:75vh;object-fit:contain;background:var(--green-soft);}
  .noimg{display:flex;height:120px;align-items:center;justify-content:center;background:var(--green-soft);color:var(--text-dim);}
  .inner{padding:16px 18px 20px;}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  h3.name{margin:0;font-size:24px;line-height:1.2;color:var(--green);font-weight:600;text-wrap:balance;}
  .price{flex:none;background:var(--accent);color:#fff;border-radius:999px;padding:4px 14px;font-weight:600;font-size:17px;}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .tag{font-size:14px;border-radius:999px;padding:5px 12px;background:var(--line);color:var(--text);}
  .tag.has{background:var(--accent-soft);color:#a8300f;}
  .tag.opt{background:var(--gold-soft);color:#6b5a2b;}
  .tag.ok{background:var(--green-soft);color:var(--green);}
  .tag.unk{background:#fff;border:1px dashed var(--text-dim);color:var(--text-dim);}
  .tag.vegan{background:var(--green);color:#fff;}
  .desc{line-height:1.65;margin:14px 0 0;font-size:17px;}
  .blk{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
  .blk h4{margin:0 0 6px;font-size:14px;color:var(--text-dim);font-weight:500;letter-spacing:.04em;}
  .blk ul{margin:0;padding-inline-start:20px;line-height:1.6;}
  .blk p{margin:0;line-height:1.6;white-space:pre-line;}
  .fine{font-size:12px;color:var(--text-dim);margin:8px 18px 0;text-align:center;}
  .empty{text-align:center;color:var(--text-dim);padding:56px 24px;}
  #top{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;width:48px;height:48px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.25);}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="../roberta-logo-white.svg" alt="רוברטה וינצ'י">
    <span class="sub">ספר מנות</span>
  </header>
  <div class="sticky">
    <div class="rowbar">
      <div id="cats" aria-label="קפיצה לקטגוריה"></div>
    </div>
  </div>
  <div id="status" hidden></div>
  <main id="list"><p class="empty">טוען תפריט...</p></main>
</div>
<button id="top" aria-label="חזרה לראש הדף" hidden>↑</button>

<script src="menu-lib.js"></script>
<script src="menu-view.js"></script>
</body>
</html>
