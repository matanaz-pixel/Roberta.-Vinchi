<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ניהול ספר מנות | רוברטה וינצ'י</title>
<meta name="theme-color" content="#023305">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../roberta-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --green:#023305; --green-soft:#e6efe6; --cream:#fbf8f2; --card:#fff;
    --line:#e9e3d6; --text:#1d2a1e; --text-dim:#5b665b; --accent:#ef4823; --gold:#b8a06a; --gold-soft:#f4ecd6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;background:var(--cream);color:var(--text);font-family:'Rubik',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  body.lock{overflow:hidden;}
  button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit;}
  button{cursor:pointer;}
  [hidden]{display:none !important;}
  .muted{color:var(--text-dim);font-size:14px;}

  .btn{background:var(--green);color:#fff;border:none;border-radius:999px;min-height:48px;padding:10px 22px;font-weight:500;}
  .btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green);}
  .btn.danger{background:#fff;color:#b3261e;border:1px solid #e3b4b0;}
  .btn.small{min-height:40px;padding:6px 16px;font-size:14px;}
  .btn:disabled{opacity:.45;cursor:default;}

  .bar{position:sticky;top:0;z-index:6;background:var(--green);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;}
  .bar .ttl{font-weight:600;flex:1;}
  .bar a,.bar button{color:#fff;}
  .bar .link{background:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;min-height:40px;padding:6px 14px;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;}
  #download{background:var(--accent);color:#fff;border:none;border-radius:999px;min-height:44px;padding:8px 20px;font-weight:600;}
  #howto{background:var(--gold-soft);border-radius:14px;padding:12px 16px;margin:12px 0;color:#5f5024;line-height:1.55;font-size:15px;}
  #draftNote{display:block;margin-top:6px;}
  #resetDraft{background:none;border:none;text-decoration:underline;color:#5f5024;padding:0;min-height:32px;font-size:15px;}
  .wrap{max-width:760px;margin:0 auto;padding:12px 16px 80px;}
  .tabs{display:flex;gap:8px;margin:12px 0;}
  .tabs button{flex:1;min-height:46px;border:1px solid var(--line);background:transparent;border-radius:999px;color:var(--text-dim);}
  .tabs button.on{background:var(--green);color:#fff;border-color:var(--green);}

  .sechead{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .sechead h2{margin:0;font-size:20px;color:var(--green);}
  .sechead small{color:var(--text-dim);font-weight:400;font-size:14px;}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin-top:8px;}
  .item.hidden{opacity:.55;}
  .thumb{flex:none;width:52px;height:64px;border-radius:10px;background:var(--green-soft);overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .item .main{flex:1;min-width:0;background:none;border:none;text-align:right;padding:6px 4px;display:flex;flex-direction:column;gap:2px;min-height:48px;}
  .item .main b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .main span{color:var(--text-dim);font-size:13px;}
  .ctl{display:flex;gap:2px;flex:none;}
  .ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--green);}
  .ic:disabled{opacity:.3;}
  .catrow{display:flex;gap:6px;align-items:center;margin-top:10px;}
  .catrow input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;}
  .catrow input.short{flex:0 0 28%;}
  #addCat{margin-top:16px;}

  #edit{position:fixed;inset:0;z-index:20;background:rgba(2,20,4,.55);display:flex;align-items:flex-end;justify-content:center;}
  .panel{background:var(--cream);width:100%;max-width:640px;max-height:96vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;}
  @media (min-width:700px){#edit{align-items:center}.panel{border-radius:24px}}
  .phead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;color:var(--green);}
  #editScroll{overflow-y:auto;padding:6px 18px 16px;}
  .fl{display:block;font-size:13px;color:var(--text-dim);margin:14px 0 4px;}
  .field{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;}
  textarea.field{min-height:84px;resize:vertical;line-height:1.5;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .chk{display:inline-flex;align-items:center;gap:6px;min-height:40px;margin-inline-end:14px;font-size:15px;}
  .chk input{width:20px;height:20px;accent-color:var(--green);}
  #preview{width:120px;height:150px;border-radius:14px;background:var(--green-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;}
  #preview img{width:100%;height:100%;object-fit:cover;}
  .imgrow{display:flex;gap:14px;align-items:flex-start;}
  .imgrow .btns{display:flex;flex-direction:column;gap:8px;}
  .filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;}
  .filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .pfoot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--cream);}
  .pfoot .btn{flex:1;}
  #editErr{color:#b3261e;font-size:14px;min-height:20px;margin-top:10px;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);background:var(--green);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s;z-index:40;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast.bad{background:#b3261e;}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>

<div id="app">
  <div class="bar">
    <span class="ttl">עריכת מנות</span>
    <a class="link" href="guide.html" target="_blank" rel="noopener">מדריך</a>
    <a class="link" href="index.html?preview" target="_blank" rel="noopener">תצוגה מקדימה</a>
    <button id="download">הורד קובץ</button>
  </div>
  <div class="wrap">
    <div id="howto">השינויים נשמרים כאן בדפדפן בלבד. כשסיימת, לחץ "הורד קובץ" והחלף את <b>menu/menu-data.json</b> באתר. עד אז המלצרים רואים את התפריט הקודם.
      <span id="draftNote" hidden>יש כאן טיוטה שלא הורדה. <button id="resetDraft" type="button">זרוק טיוטה</button></span></div>
    <div class="tabs"><button id="tabItems" class="on">מנות</button><button id="tabCats">קטגוריות</button></div>
    <div id="paneItems"></div>
    <div id="paneCats" hidden></div>
  </div>
</div>

<div id="edit" hidden role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <div class="panel">
    <div class="phead" id="editTitle">עריכת מנה</div>
    <div id="editScroll">
      <label class="fl" for="f_name">שם המנה</label><input class="field" id="f_name" maxlength="60">
      <div class="two">
        <div><label class="fl" for="f_price">מחיר (₪)</label><input class="field" id="f_price" type="number" inputmode="numeric" min="0" max="9999"></div>
        <div><label class="fl" for="f_cat">קטגוריה</label><select class="field" id="f_cat"></select></div>
      </div>
      <label class="fl" for="f_desc">תיאור</label><textarea class="field" id="f_desc" maxlength="1200"></textarea>

      <span class="fl">תמונה</span>
      <div class="imgrow">
        <div id="preview"></div>
        <div class="btns">
          <span class="btn ghost small filebtn">החלף תמונה<input type="file" id="file" accept="image/*"></span>
          <button class="btn danger small" id="rmImg" type="button">הסר תמונה</button>
          <span class="muted">התמונה מוקטנת אוטומטית</span>
        </div>
      </div>

      <div class="two">
        <div><label class="fl" for="f_gluten">גלוטן</label><select class="field" id="f_gluten"><option value="yes">מכילה</option><option value="no">לא מכילה</option><option value="unknown">לא צוין</option></select></div>
        <div><label class="fl" for="f_lactose">לקטוז</label><select class="field" id="f_lactose"><option value="yes">מכילה</option><option value="no">לא מכילה</option><option value="unknown">לא צוין</option></select></div>
      </div>
      <label class="fl" for="f_glutenNote">הערה על גלוטן (למשל: אופציה ללא גלוטן ללא הקרוטונים)</label><input class="field" id="f_glutenNote" maxlength="200">
      <label class="fl" for="f_lactoseNote">הערה על לקטוז</label><input class="field" id="f_lactoseNote" maxlength="200">
      <span class="fl">אלרגנים נוספים</span><div id="otherAl"></div>
      <label class="chk"><input type="checkbox" id="f_vegan"> טבעונית</label>

      <label class="fl" for="f_mods">שינויים אפשריים</label><textarea class="field" id="f_mods" maxlength="600"></textarea>
      <label class="fl" for="f_notes">הערות למלצר (שורה לכל הערה)</label><textarea class="field" id="f_notes" maxlength="1200"></textarea>
      <label class="fl" for="f_pregnancy">הערות להיריון (שורה לכל הערה)</label><textarea class="field" id="f_pregnancy" maxlength="600"></textarea>
      <label class="chk"><input type="checkbox" id="f_visible"> מוצגת למלצרים</label>
      <div id="editErr" role="alert"></div>
    </div>
    <div class="pfoot">
      <button class="btn danger" id="delItem" type="button">מחק</button>
      <button class="btn ghost" id="cancelItem" type="button">ביטול</button>
      <button class="btn" id="saveItem" type="button">שמור</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="menu-lib.js"></script>
<script src="menu-admin.js"></script>
</body>
</html>
