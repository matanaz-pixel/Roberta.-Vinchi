<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>אישור מבחנים | רוברטה וינצ'י</title>
<meta name="theme-color" content="#023305">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../roberta-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root{--green:#023305;--green-soft:#e6efe6;--cream:#fbf8f2;--card:#fff;--line:#e9e3d6;--text:#1d2a1e;--text-dim:#5b665b;--accent:#ef4823;--gold-soft:#f4ecd6;--ok:#1d7a34;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--cream);color:var(--text);font-family:'Rubik',system-ui,sans-serif;}
  button{font-family:inherit;font-size:15px;color:inherit;cursor:pointer;}
  [hidden]{display:none !important;}
  .bar{position:sticky;top:0;z-index:6;background:var(--green);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap;}
  .bar .ttl{font-weight:600;flex:1;}
  .bar a{color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none;}
  #download{background:var(--accent);color:#fff;border:none;border-radius:999px;min-height:44px;padding:8px 20px;font-weight:600;}
  .wrap{max-width:760px;margin:0 auto;padding:12px 16px 80px;}
  #howto{background:var(--gold-soft);border-radius:14px;padding:12px 16px;margin:12px 0;color:#5f5024;line-height:1.55;font-size:15px;}
  #howto button{background:none;border:none;text-decoration:underline;color:#5f5024;padding:0;font-size:15px;}
  #warn{background:var(--accent-soft,#fde8e2);color:#a8300f;border-radius:14px;padding:12px 16px;margin:12px 0;line-height:1.55;font-size:15px;}
  details.ver{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px;}
  details.ver>summary{list-style:none;padding:14px 16px;display:flex;gap:10px;align-items:center;cursor:pointer;min-height:52px;}
  details.ver>summary::-webkit-details-marker{display:none;}
  .chip{font-size:13px;border-radius:999px;padding:3px 12px;background:var(--line);}
  .chip.ok{background:var(--green-soft);color:var(--ok);font-weight:500;}
  .vtitle{font-weight:600;color:var(--green);flex:1;}
  .vbody{padding:0 14px 14px;}
  .q{border-top:1px solid var(--line);padding:12px 0;}
  .q.ok{background:#f3faf4;}
  .qt{font-weight:500;line-height:1.45;}
  .qt small{color:var(--text-dim);font-weight:400;}
  .o{padding:4px 0;color:var(--text-dim);font-size:15px;}
  .o.c{color:var(--ok);font-weight:600;}
  .acts{display:flex;gap:8px;margin-top:8px;}
  .acts button{border-radius:999px;border:1px solid var(--line);background:#fff;min-height:40px;padding:6px 16px;}
  .acts .yes{border-color:var(--ok);color:var(--ok);}
  .acts .yes.on{background:var(--ok);color:#fff;}
  .vact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .vact button,.vact a{border-radius:999px;border:1px solid var(--green);background:transparent;color:var(--green);min-height:42px;padding:8px 18px;text-decoration:none;display:inline-flex;align-items:center;}
  .vact .all{background:var(--green);color:#fff;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);background:var(--green);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s;z-index:40;max-width:90vw;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<div class="bar">
  <span class="ttl">אישור מבחנים</span>
  <a href="admin.html">עריכת מנות</a>
  <a href="guide.html#quiz">מדריך</a>
  <button id="download">הורד קובץ</button>
</div>
<div class="wrap">
  <div id="howto">עוברים על כל שאלה: <b>אשר</b> אם היא נכונה ורלוונטית, או <b>החלף</b> כדי לקבל שאלה אחרת. גרסה נחשבת מאושרת כשכל 20 השאלות בה מאושרות, ורק גרסאות מאושרות מוצגות למלצרים. בסוף "הורד קובץ" והחלף את <b>menu/quiz-data.json</b> באתר.
    <span id="draftNote" hidden><br>יש כאן טיוטה שלא הורדה. <button id="resetDraft" type="button">זרוק טיוטה</button></span></div>
  <div id="warn" hidden></div>
  <div id="summary" class="muted"></div>
  <div id="list"></div>
  <div class="vact"><button id="rebuild" type="button">בנה את כל הגרסאות מחדש מהתפריט</button></div>
</div>
<div id="toast" role="status"></div>
<script src="menu-lib.js"></script>
<script src="quiz-lib.js"></script>
<script src="quiz-admin.js"></script>
</body>
</html>
