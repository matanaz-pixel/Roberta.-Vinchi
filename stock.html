<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>מלאי והכנות</title>
<meta name="theme-color" content="#023305">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="./roberta-logo.png">
<link rel="manifest" href="./stock.webmanifest">
<link rel="apple-touch-icon" href="./roberta-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מלאי והכנות">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --green:#023305; --green-soft:#e6efe6; --cream:#fbf8f2; --card:#ffffff;
    --line:#e9e3d6; --text:#1d2a1e; --text-dim:#566256; --accent:#c93a18; --accent-soft:#fde8e3; --ok:#1a7f33;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; min-height:100%; background:var(--cream); color:var(--text); font-family:'Rubik',sans-serif; -webkit-tap-highlight-color:transparent; }
  header{ background:var(--green); padding:18px 16px 16px; text-align:center; }
  header img{ height:30px; max-width:80%; }
  header .sub{ color:#d6e5d6; font-size:13px; letter-spacing:.18em; margin-top:8px; }
  .app{ width:100%; max-width:560px; margin:0 auto; padding:12px 16px calc(120px + env(safe-area-inset-bottom)); }
  .locked .app, .locked .bar{ display:none !important; }
  button, input, select{ font-family:inherit; }
  button:active{ transform:scale(.98); filter:brightness(.94); }
  :focus-visible{ outline:3px solid #1a7f33; outline-offset:2px; }
  h1:focus, h1:focus-visible{ outline:none; }
  h1{ font-size:24px; margin:6px 0 4px; color:var(--green); }
  h2{ font-size:18px; margin:0; }
  .dim{ color:var(--text-dim); font-size:14px; }
  .banner{ background:#fff4e0; border:1px solid #f0c27a; color:#6b3f00; border-radius:12px; padding:10px 14px; font-size:14px; margin-bottom:10px; }
  .banner.err{ background:var(--accent-soft); border-color:#e8a898; color:#8f2a10; }

  .top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .back{ min-width:48px; min-height:48px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-size:22px; color:var(--green); cursor:pointer; }
  .top .ttl{ flex:1; }
  .days{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 14px; }
  .chip{ min-height:48px; padding:0 18px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; cursor:pointer; }
  .chip[aria-pressed=true]{ background:var(--green); color:#fff; border-color:var(--green); }
  select.chip{ appearance:auto; }

  .stations{ display:flex; flex-direction:column; gap:12px; }
  .st{ display:block; width:100%; text-align:right; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px 18px; min-height:84px; cursor:pointer; color:var(--text); }
  .st h2{ font-size:22px; color:var(--green); }
  .st p{ margin:6px 0 0; font-size:15px; color:var(--text-dim); }
  .st.done{ border-color:#9cc9a4; }
  .link{ background:none; border:none; color:var(--green); font-size:16px; text-decoration:underline; min-height:48px; padding:0 6px; cursor:pointer; }

  .rows{ display:flex; flex-direction:column; gap:10px; }
  .row{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px; }
  .row.bad{ border-color:var(--accent); background:#fffafa; }
  .row .l1{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .row .nm{ font-size:19px; font-weight:500; }
  .row .base{ font-size:14px; color:var(--text-dim); }
  .row .l2{ display:flex; gap:8px; margin-top:10px; align-items:center; }
  .row input{ flex:1; min-width:0; height:52px; border:1.5px solid var(--line); border-radius:14px; text-align:center; font-size:24px; font-weight:500; background:#fff; color:var(--text); }
  .row input:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .row .step{ width:56px; height:52px; border-radius:14px; border:1.5px solid var(--green); background:var(--card); color:var(--green); font-size:28px; line-height:1; cursor:pointer; }
  .row .clr{ min-width:56px; height:52px; border:none; background:none; color:var(--text-dim); font-size:14px; text-decoration:underline; cursor:pointer; }
  .progress{ font-size:15px; color:var(--text-dim); margin:2px 2px 10px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label{ font-size:14px; color:var(--text-dim); }
  .field input{ height:52px; border:1.5px solid var(--line); border-radius:14px; padding:0 14px; font-size:18px; background:#fff; color:var(--text); }

  .bar{ position:fixed; inset-inline:0; bottom:0; background:var(--cream); border-top:1px solid var(--line); padding:10px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:10px; max-width:560px; margin:0 auto; }
  .btn{ flex:1; min-height:56px; border-radius:999px; border:1.5px solid var(--green); background:var(--card); color:var(--green); font-size:18px; font-weight:500; cursor:pointer; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; padding:0 16px; }
  .btn.primary{ background:var(--green); color:#fff; }
  .btn.wa{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .row.warnrow{ border-color:#d9a400; background:#fffdf3; }
  .row .warn, .need .warn{ margin-top:6px; font-size:15px; color:#8a5a00; font-weight:500; }
  .pbar{ position:fixed; inset-inline:0; bottom:0; margin:0 auto; max-width:560px; background:var(--cream); border-top:1px solid var(--line); padding:10px 16px calc(12px + env(safe-area-inset-bottom)); z-index:5; }
  .need .cov.lvl-bad{ color:var(--accent); } .need .cov.lvl-warn{ color:#8a5a00; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
  .actions .btn{ flex:1 1 140px; }

  .need{ display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px; }
  .need .info{ flex:1; min-width:0; }
  .need .info a{ display:inline-flex; align-items:center; min-height:48px; padding:0 8px; color:var(--green); }
  .need .nm{ font-size:19px; font-weight:500; }
  .need .sub{ font-size:14px; color:var(--text-dim); margin-top:2px; }
  .need .q{ text-align:center; min-width:76px; }
  .need .q b{ display:block; font-size:30px; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums; }
  .need .q span{ font-size:13px; color:var(--text-dim); }
  .need a{ display:inline-block; margin-top:4px; color:var(--green); font-size:15px; padding:10px 6px; min-height:44px; }
  .need .pq{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .need .pq .l2{ display:flex; gap:6px; align-items:center; }
  .need .pq input{ width:72px; height:52px; border:1.5px solid var(--line); border-radius:14px; text-align:center; font-size:24px; font-weight:500; background:#fff; color:var(--text); }
  .need .pq input:focus{ outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
  .need .pq .step{ width:48px; height:52px; border-radius:14px; border:1.5px solid var(--green); background:var(--card); color:var(--green); font-size:28px; line-height:1; cursor:pointer; }
  .need .pq span{ font-size:13px; color:var(--text-dim); }
  .need .cov{ font-size:15px; color:var(--green); margin-top:4px; font-weight:500; }
  .need.wrapcol{ flex-wrap:wrap; }
  .grp{ margin:16px 0 8px; font-size:16px; font-weight:600; color:var(--green); }
  details.grp-d{ margin-top:14px; }
  details.grp-d summary{ min-height:48px; display:flex; align-items:center; cursor:pointer; font-weight:600; color:var(--green); }
  .mini{ display:flex; justify-content:space-between; gap:8px; padding:10px 4px; border-bottom:1px dashed var(--line); font-size:16px; }
  .empty{ text-align:center; color:var(--text-dim); font-size:15px; padding:26px 10px; border:1px dashed var(--line); border-radius:16px; }

  .adm{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:6px; }
  .adm summary{ display:flex; justify-content:space-between; gap:8px; align-items:center; min-height:56px; padding:8px 14px; cursor:pointer; list-style:none; }
  .adm summary::-webkit-details-marker{ display:none; }
  .adm .nm{ font-size:18px; font-weight:500; }
  .adm .qs{ text-align:left; font-size:15px; font-variant-numeric:tabular-nums; }
  .adm .qs b{ font-size:20px; color:var(--accent); }
  .adm .body{ padding:0 14px 12px; font-size:15px; }
  .adm .tot{ color:var(--text-dim); margin-bottom:6px; }
  .adm .dl{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
  .adm .dl.short{ color:var(--accent); font-weight:600; }
  .adm .cv{ margin-top:8px; font-weight:600; color:var(--green); }
  .adm-date{ display:flex; gap:8px; align-items:center; margin:8px 0 4px; flex-wrap:wrap; }
  .adm-date input{ height:48px; border:1.5px solid var(--line); border-radius:14px; padding:0 12px; font-size:16px; background:#fff; color:var(--text); }
  .hday{ margin:16px 0 6px; font-size:17px; font-weight:600; }
  .hst{ margin:0 0 8px; }
  .hst .t{ font-size:14px; color:var(--text-dim); margin:6px 2px; }
  .hc{ display:flex; width:100%; justify-content:space-between; gap:8px; align-items:center; text-align:right; min-height:52px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 14px; margin-bottom:6px; font-size:16px; color:var(--text); cursor:pointer; }
  .hc .tag{ font-size:13px; background:var(--green-soft); color:var(--green); border-radius:999px; padding:2px 10px; }

  /* שער אישור מכשיר (כמו בספר המתכונים) */
  .gate{ max-width:560px; margin:0 auto; padding:22px 16px calc(40px + env(safe-area-inset-bottom)); }
  .gate[hidden]{ display:none; }
  .gate-box{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:22px 18px; display:flex; flex-direction:column; gap:14px; }
  .gate p{ margin:0; font-size:15px; line-height:1.6; }
  .gate input[type=text]{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; font-size:17px; min-height:48px; background:#fff; color:var(--text); }
  .gate .code{ font-size:30px; font-weight:600; letter-spacing:.25em; color:var(--green); text-align:center; direction:ltr; background:var(--green-soft); border-radius:14px; padding:10px; }
  .gate button{ min-height:50px; border-radius:999px; border:1px solid var(--green); font:inherit; font-size:16px; font-weight:500; cursor:pointer; background:transparent; color:var(--green); }
  .gate button.primary{ background:var(--green); color:#fff; }
  .hp{ position:absolute; inset-inline-start:-9999px; width:1px; height:1px; opacity:0; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  /* ===== עיצוב מהודק (v2) ===== */
  :root{ --line:#e3dccb; --gold:#b8a06a; }
  body{ font-variant-numeric:tabular-nums; }
  header{ position:relative; margin-bottom:5px; padding:16px 16px 14px; box-shadow:0 5px 0 var(--green); }
  header::after{ content:""; position:absolute; inset-inline:0; bottom:-3px; height:1px; background:var(--gold); }
  header img{ height:30px; }
  header .sub{ font-size:12px; letter-spacing:.3em; opacity:.7; margin-top:8px; }
  h1{ font-weight:300; font-size:30px; letter-spacing:-.01em; }
  .back{ border-radius:50%; border-color:#d9d1bd; }
  .chip, .tab{ border-color:#d9d1bd; }

  .st{ border-radius:12px; border:1px solid var(--line); border-inline-start:5px solid #d9d1bd; padding:14px 16px; min-height:84px; }
  .st h2{ font-size:24px; font-weight:500; letter-spacing:-.01em; }
  .st.done{ border-color:var(--line); border-inline-start-color:var(--ok); }
  .row{ border-radius:12px; }
  .row input{ border-radius:10px; font-weight:500; background:var(--cream); border-color:var(--line); }
  .row .step{ border-radius:10px; border-width:1.5px; }
  .row .step:nth-of-type(2){ background:var(--green); color:#fff; border-color:var(--green); }
  .field input{ border-radius:10px; }
  .progress{ letter-spacing:.02em; }
  .bar, .pbar{ border-top-color:var(--line); }
  .need{ border-radius:12px; }

  /* ===== עיצוב מהודק v3: מבנה ולא רק צבע ===== */
  .app{ padding-top:4px; }
  .eyebrow, .sect, .grp{ font-size:12px; letter-spacing:.2em; color:var(--text-dim); font-weight:500; }
  .hero{ padding:20px 2px 0; }
  .hero-row{ display:flex; align-items:baseline; justify-content:space-between; }
  .hero h1{ font-size:60px; font-weight:300; letter-spacing:-.02em; line-height:1.05; margin:2px 0 0; color:var(--green); }
  .hdate{ font-size:18px; color:var(--text-dim); direction:ltr; }
  .days.seg{ display:flex; flex-wrap:nowrap; gap:0; background:#fff; border:1px solid #d9d1bd; border-radius:999px; padding:3px; margin:14px 0 6px; }
  .days.seg .chip{ flex:1; min-width:0; border:0; background:transparent; min-height:42px; padding:0 4px; font-size:14px; color:var(--text-dim); text-align:center; text-align-last:center; }
  .days.seg .chip[aria-pressed=true]{ background:var(--green); color:#fff; font-weight:500; }
  .days.seg select.chip{ appearance:none; -webkit-appearance:none; }
  .sect{ display:flex; align-items:center; gap:12px; margin:22px 0 10px; }
  .sect::after{ content:""; flex:1; height:1px; background:linear-gradient(to left,#d9d1bd,transparent); }
  .stations{ gap:10px; }
  .st{ display:flex; flex-direction:column; justify-content:space-between; gap:12px; min-height:92px; padding:14px 16px; box-shadow:none; }
  .st-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .st-tag{ font-size:13px; font-weight:500; color:var(--green); }
  .st-tag.bad{ color:var(--accent); } .st-tag.ok{ color:var(--ok); }
  .st-bot{ display:flex; align-items:center; gap:10px; }
  .st-bot p{ margin:0; font-size:13px; flex:1; min-width:0; }
  .segs{ display:flex; gap:3px; width:64px; flex:none; }
  .segs i, .psegs i{ flex:1; height:4px; border-radius:2px; background:var(--line); }
  .segs i.on, .psegs i.on{ background:var(--ok); }
  .tabnav{ position:fixed; inset-inline:0; bottom:0; max-width:560px; margin:0 auto; display:flex; background:var(--cream); border-top:1px solid var(--line); padding:8px 16px calc(14px + env(safe-area-inset-bottom)); z-index:5; }
  .tabnav .tn{ flex:1; text-align:center; font-size:13px; color:var(--text-dim); padding:12px 0; min-height:44px; text-decoration:none; background:none; border:0; border-top:2px solid transparent; margin-top:-9px; cursor:pointer; }
  .tabnav .tn.on{ color:var(--green); font-weight:600; border-top-color:var(--green); }
  .top{ gap:12px; margin-bottom:6px; }
  .top .ttl{ display:flex; flex-direction:column; }
  .top .ttl .dim{ order:-1; font-size:12px; letter-spacing:.12em; margin:0; }
  .top .ttl h1{ font-size:32px; font-weight:300; margin:0; line-height:1.1; color:var(--green); }
  .back{ min-width:46px; min-height:46px; }
  .progress{ display:flex; flex-direction:column; gap:8px; margin:8px 0 12px; }
  .pcount{ font-size:14px; color:var(--text-dim); }
  .psegs{ display:flex; gap:4px; } .psegs i{ height:3px; }
  .row{ padding:12px 14px; }
  .row .l1 .nm{ font-size:19px; font-weight:500; }
  .row .l2{ gap:8px; margin-top:8px; }
  .row .step{ width:52px; height:52px; }
  .row input{ height:52px; font-size:28px; }
  .grp{ margin:18px 0 8px; }
  .need{ flex-direction:column; align-items:stretch; gap:4px; border-radius:12px; padding:12px 14px; }
  .need.wrapcol{ flex-wrap:nowrap; }
  .need .info{ display:contents; }
  .need .nm{ order:1; font-size:19px; font-weight:500; }
  .need .sub{ order:2; font-size:13px; }
  .need .pq{ order:3; flex-direction:row; align-items:center; gap:8px; margin-top:6px; }
  .need .pq > span{ font-size:12px; letter-spacing:.06em; max-width:56px; line-height:1.2; }
  .need .pq{ min-width:0; width:100%; }
  .need .pq .l2{ flex:1; min-width:0; display:flex; gap:8px; align-items:center; }
  .need .pq input{ flex:1; min-width:0; width:auto; height:52px; border:0; background:transparent; font-size:38px; font-weight:300; color:var(--green); padding:0; }
  .need .pq .step{ width:48px; height:48px; border-radius:10px; border-width:1.5px; flex:none; }
  .need .pq .l2 .step:nth-of-type(2){ background:var(--green); color:#fff; border-color:var(--green); }
  .need .conv{ order:4; font-size:14px; color:var(--text-dim); margin-top:2px; }
  .need .chips{ order:5; display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .need .chips .chip{ min-height:44px; padding:0 12px; border:1px solid var(--line); background:#fff; border-radius:999px; font-size:14px; cursor:pointer; color:var(--text); }
  .need .chips .chip[aria-pressed=true]{ background:var(--green); color:#fff; border-color:var(--green); }
  .row .conv, .row .kind{ font-size:14px; color:var(--text-dim); margin-top:4px; }
  .strip{ order:6; display:flex; gap:4px; margin-top:6px; }
  .strip .sc{ flex:1; text-align:center; }
  .strip .sb{ display:block; position:relative; height:26px; border-radius:6px; background:#f1ece0; overflow:hidden; border:1px solid transparent; }
  .strip .sb.off{ background:transparent; border:1px dashed #cfc8b8; }
  .strip .sb i{ position:absolute; inset-inline:0; bottom:0; background:var(--green); height:0; }
  .strip .sb i.part{ background:var(--accent); }
  .strip .sl{ display:block; margin-top:3px; font-size:12px; color:#8a948a; }
  .need .cov{ order:7; font-size:14px; margin-top:6px; }
  .need .rlink{ order:8; align-self:flex-start; }
  .need .warn{ order:9; }
  .adm{ border-radius:12px; }
</style>
</head>
<body>
<header>
  <img src="./roberta-logo-white.svg" alt="Roberta Vinci">
  <div class="sub">מלאי והכנות</div>
</header>
<div class="gate" id="gate" hidden></div>
<main class="app" id="app">
  <div id="banners"></div>
  <div id="view"></div>
</main>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<script src="recipes-lib.js"></script>
<script src="stock-lib.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="./firebase-init.js"></script>
<script>
// ============ הגדרות ============
// אותו Web App של ספר המתכונים: הגדרות המוצרים נקראות ממנו רק למכשיר מאושר (אותו אישור מכשיר, אותו מפתח במכשיר).
const ACCESS_URL = 'https://script.google.com/macros/s/AKfycbyT2q5HDJJ77nzPrpd-FayB1Mq5piCG6kLpP9Kx1zq-h4dbEYZPtgNK5JYG4WXv9xSj/exec';
const DEVICE_KEY = 'rb-device-v1', SENDER_KEY = 'rb-sender', PREP_KEY = 'rb-prep-v1';
function prepVals(){ const d = store.get(PREP_KEY); return d && typeof d === 'object' ? d : {}; }
const DEFS_KEY = 'sk-defs-v1', DRAFT_KEY = 'sk-draft-v1', OUTBOX_KEY = 'sk-outbox-v1', PREPOUT_KEY = 'sk-prepout-v1';
const DRAFT_MAX_AGE = 2 * 24 * 3600e3;
const SK = window.SK || null;
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const say = t => { $('live').textContent = ''; setTimeout(() => { $('live').textContent = t; }, 30); };

// ============ שעון: שעון השרת של Firebase קודם, כדי ששעון מכשיר שגוי לא יכתוב ליום הלא נכון ============
let clockOffset = 0, connected = null, fbReady = false;
const nowMs = () => Date.now() + clockOffset;
const nowDate = () => new Date(nowMs());
const hhmm = t => new Date(t).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Jerusalem' });

function fmtDate(k){ const [y, m, d] = k.split('-'); return `${SK.DAYS[dayOfDateKey(k)]} ${Number(d)}/${Number(m)}`; }

// ============ שער אישור מכשיר ============
function deviceId(){
  try{
    let v = localStorage.getItem(DEVICE_KEY);
    if(RB.isDeviceId(v)) return v;
    v = RB.newDeviceId(crypto.getRandomValues(new Uint8Array(16)));
    localStorage.setItem(DEVICE_KEY, v);
    return v;
  }catch(e){ return ''; }
}
async function fetchText(url, ms){
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, { cache: 'no-store', signal: ctl.signal }); return r.ok ? await r.text() : ''; }finally{ clearTimeout(timer); }
}
async function fetchStock(){
  const id = deviceId();
  if(!id) return { acc: { status: 'nostorage' }, text: '' };
  let text = '';
  try{ text = await fetchText(`${ACCESS_URL}?a=stock&d=${id}`, 12000); }catch(e){}
  return { acc: RB.parseAccess(text), text };
}
async function sendAccessRequest(name){
  try{
    const res = await fetch(ACCESS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ a: 'request', dev: deviceId(), name, website: $('gate-hp')?.value || '' }) });
    const text = (await res.text()).trim();
    const acc = RB.parseAccess(text);
    return acc ? { acc } : { err: text };
  }catch(e){ return { err: 'network' }; }
}
const GATE_ERRORS = { network: 'אין חיבור לאינטרנט. נסו שוב.', busy: 'יש כרגע הרבה בקשות. נסו שוב בעוד כמה דקות.', invalid: 'כתבו את השם שלכם.', error: 'אירעה שגיאה. נסו שוב.' };

function hideGate(){ clearInterval(gateTimer); gateTimer = 0; gateStatus = ''; document.body.classList.remove('locked'); $('gate').hidden = true; }
function lockOut(acc){
  store.del(DEFS_KEY); isAdmin = false;
  defs = {}; live = {}; histCache = {};
  if(unsub){ unsub(); unsub = null; }
  $('view').replaceChildren();
  started = false;
  showGate(acc);
}
async function recheckGate(){
  if(gateStatus === 'unknown' || gateStatus === 'nostorage') return;
  const { acc } = await fetchStock();
  if(acc && acc.status === 'ok'){ hideGate(); boot(); }
  else if(acc && acc.status !== gateStatus) showGate(acc);
  else if(!acc && gateStatus !== 'offline') showGate({ status: 'offline' });
}
function showGate(acc){
  const g = $('gate');
  document.body.classList.add('locked'); g.hidden = false;
  clearInterval(gateTimer); gateTimer = 0; gateStatus = acc.status;
  const box = el('div', 'gate-box');
  const msg = el('p'); msg.hidden = true; msg.setAttribute('role', 'alert'); msg.style.color = 'var(--accent)';
  const err = t => { msg.textContent = t; msg.hidden = false; };
  const btn = (label, cls, fn) => { const b = el('button', cls, label); b.type = 'button'; b.onclick = fn; return b; };
  if(acc.status === 'unknown'){
    box.append(el('h1', '', 'מלאי והכנות'), el('p', '', 'כדי לפתוח צריך אישור. אם כבר אושרתם בספר המתכונים מאותו מכשיר, האישור תקף גם כאן. אחרת כתבו את השם שלכם ולחצו על הבקשה.'));
    const name = el('input'); name.type = 'text'; name.maxLength = 60; name.placeholder = 'השם שלך'; name.autocomplete = 'name'; name.setAttribute('aria-label', 'השם שלך');
    try{ name.value = localStorage.getItem(SENDER_KEY) || ''; }catch(e){}
    const hp = el('input', 'hp'); hp.type = 'text'; hp.id = 'gate-hp'; hp.tabIndex = -1; hp.autocomplete = 'off'; hp.setAttribute('aria-hidden', 'true');
    const go = btn('בקש גישה', 'primary', async () => {
      const n = name.value.trim();
      if(!n){ err(GATE_ERRORS.invalid); name.focus(); return; }
      go.disabled = true; go.textContent = 'שולח...'; msg.hidden = true;
      const r = await sendAccessRequest(n);
      go.disabled = false; go.textContent = 'בקש גישה';
      if(r.acc){ try{ localStorage.setItem(SENDER_KEY, n); }catch(e){} r.acc.status === 'ok' ? (hideGate(), boot()) : showGate(r.acc); }
      else err(GATE_ERRORS[r.err] || GATE_ERRORS.error);
    });
    name.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); go.click(); } });
    box.append(name, hp, go, msg);
  }else if(acc.status === 'pending'){
    box.append(el('h1', '', 'הבקשה נשלחה'), el('p', '', (acc.name ? acc.name + ', ' : '') + 'ברגע שיאשרו אותך האפליקציה תיפתח כאן לבד. אפשר להשאיר את הדף פתוח.'));
    if(acc.code) box.append(el('p', '', 'הקוד שלך (כדי שיזהו אותך):'), el('div', 'code', acc.code));
    box.append(btn('בדוק עכשיו', 'primary', async e => { e.target.textContent = 'בודק...'; await recheckGate(); if(gateStatus === 'pending'){ e.target.textContent = 'עדיין לא אושר'; setTimeout(() => { e.target.textContent = 'בדוק עכשיו'; }, 2500); } }));
    gateTimer = setInterval(() => { if(document.visibilityState === 'visible') recheckGate(); }, 20000);
  }else if(acc.status === 'blocked'){
    box.append(el('h1', '', 'אין גישה'), el('p', '', 'הגישה מהמכשיר הזה אינה פעילה. אם זו טעות, אפשר לפנות למי שמאשר.'), btn('בדוק שוב', 'primary', recheckGate));
  }else if(acc.status === 'nostorage'){
    box.append(el('h1', '', 'לא ניתן לשמור נתונים'), el('p', '', 'הדפדפן חוסם שמירה באתר (אולי גלישה פרטית). פתחו בחלון רגיל.'));
  }else if(acc.status === 'oldserver'){
    box.append(el('h1', '', 'השרת עדיין לא מעודכן'), el('p', '', 'צריך לפרסם גרסה חדשה של Code.gs ב-Apps Script כדי שהמלאי יעבוד.'), btn('נסה שוב', 'primary', recheckGate));
  }else{
    box.append(el('h1', '', 'אין חיבור'), el('p', '', 'כדי לאמת את המכשיר צריך להתחבר לאינטרנט. אחרי הכניסה הראשונה אפשר לעבוד גם בלי קליטה.'), btn('נסה שוב', 'primary', recheckGate));
  }
  g.replaceChildren(box);
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && gateStatus && gateStatus !== 'unknown') recheckGate(); });

// ============ הגדרות מוצרים ============
function applyDefs(stations){
  defs = {};
  for(const s of SK.STATIONS){
    const csv = stations && stations[s.key];
    if(!csv){ defs[s.key] = { products: [], warnings: [], missing: true }; continue; }
    const p = SK.parseDefs(csv);
    defs[s.key] = p ? p : (SK.defsProblem(csv) === 'empty' ? { products: [], warnings: [], empty: true } : { products: [], warnings: [], error: true });
  }
}
async function boot(){
  const id = deviceId();
  if(!id){ showGate({ status: 'nostorage' }); return; }
  let cache = store.get(DEFS_KEY);
  if(cache && !RB.cacheValid(cache.ts, Date.now())) cache = null;
  if(cache && !started){ isAdmin = cache.admin === true; lintList = Array.isArray(cache.lint) ? cache.lint : []; applyDefs(cache.stations); start(); }
  const { acc, text } = await fetchStock();
  if(acc && acc.status !== 'ok'){ lockOut(acc); return; }
  if(acc){
    flags.defsOld = false;
    isAdmin = acc.admin === true;
    store.set(DEFS_KEY, { ts: Date.now(), stations: acc.stations || {}, admin: isAdmin, lint: Array.isArray(acc.lint) ? acc.lint : [] });
    lintList = Array.isArray(acc.lint) ? acc.lint : [];
    applyDefs(acc.stations || {});
    if(!started) start(); else route();
    renderBanners();
    return;
  }
  if(!cache){ showGate({ status: text ? 'oldserver' : 'offline' }); return; }
  flags.defsOld = true; renderBanners();
}

// ============ Firebase ============
function initFb(){
  if(typeof firebase === 'undefined' || typeof db === 'undefined') return;
  fbReady = true;
  db.ref('.info/serverTimeOffset').on('value', s => { clockOffset = Number(s.val()) || 0; checkDate(); renderBanners(); });
  db.ref('.info/connected').on('value', s => { connected = !!s.val(); renderBanners(); if(connected) flush(); });
}
const CTRL_RE = /[\u0000-\u001f\u007f-\u009f\u200e\u200f\u202a-\u202e\u2066-\u2069]/g;
function cleanBy(v){ return String(v || '').replace(CTRL_RE, '').trim().slice(0, 40); }
function normCounts(obj, dateKey){            // מגן מפני נתונים פגומים, גם אם הכללים נשברו
  const out = Object.create(null);
  if(!obj || typeof obj !== 'object') return out;
  const okDays = dateKey ? [dateKey, SK.addDays(dateKey, 1)] : null;   // ספירה חייבת להיות מתוארכת ליום שלה או ליום שאחריו (חצות)
  for(const [id, c] of Object.entries(obj)){
    if(id === '__proto__') continue;
    if(!c || typeof c !== 'object' || typeof c.t !== 'number' || typeof c.by !== 'string' || !c.items || typeof c.items !== 'object') continue;
    const items = {};
    if(okDays && !okDays.includes(SK.dateKey(c.t))) continue;
    const by = cleanBy(c.by); if(!by) continue;
    for(const [k, v] of Object.entries(c.items)) if(k !== '__proto__' && typeof v === 'number' && isFinite(v) && v >= 0) items[k] = v;
    out[id] = { t: c.t, by, items };
  }
  return out;
}
function normDay(v, dateKey){ const out = {}; for(const s of SK.STATIONS) out[s.key] = normCounts(v && v[s.key], dateKey); return out; }
function watchToday(){
  if(unsub){ unsub(); unsub = null; }
  live = {};
  if(!fbReady) return;
  const ref = db.ref('stock/' + today);
  const cb = snap => { live = normDay(snap.val(), today); route(); };
  ref.on('value', cb, () => { renderBanners(); });
  unsub = () => ref.off('value', cb);
}
function checkDate(){
  if(!SK) return;
  const k = SK.dateKey(nowDate());
  if(k !== today){ today = k; watchToday(); route(); }
}
setInterval(checkDate, 30000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkDate(); });

// ספירות של תאריך+פס: מה שבשרת, ועוד מה שנשמר במכשיר וטרם אושר (כדי שהרשימה תוצג מיד, גם בלי קליטה)
function outbox(){ const o = store.get(OUTBOX_KEY); return Array.isArray(o) ? o : []; }
function countsFor(date, st){
  const base = date === today ? (live[st] || {}) : ((histCache[date] || {})[st] || {});
  const out = { ...base };
  for(const e of outbox()) if(e.date === date && e.station === st && !out[e.id]) out[e.id] = e.count;
  return out;
}
async function flush(){
  if(flushing || !fbReady) return;
  flushing = true;
  try{
    for(const e of outbox()){
      const ref = db.ref(`stock/${e.date}/${e.station}/${e.id}`);
      try{
        await ref.set(e.count);
        if(e.date !== today){ const h = histCache[e.date]; if(h) (h[e.station] = h[e.station] || {})[e.id] = e.count; }   // תאריך שאינו היום לא מושמע חי
        store.set(OUTBOX_KEY, outbox().filter(x => x.id !== e.id));
      }catch(err){
        // אותה ספירה כבר נכתבה (מזהה זהה): מוחקים מהתור. אחרת היא נדחתה, ולא ממשיכים לנסות
        let exists = false;
        try{ exists = (await ref.once('value')).exists(); }catch(x){ continue; }
        store.set(OUTBOX_KEY, outbox().filter(x => x.id !== e.id));
        if(!exists) flags.rejected = true;
      }
    }
    await flushPrep();
  }finally{ flushing = false; renderBanners(); route(); }
}
// החלטת ההכנה של הטבח (כמה להכין) נשלחת ל-Firebase כשהוא לוחץ על הוואטסאפ. נכשל = נשמר במכשיר ונשלח שוב מאוחר יותר.
function prepOut(){ const o = store.get(PREPOUT_KEY); return Array.isArray(o) ? o : []; }
function queuePrep(e){
  const k = x => [x.date, x.station, x.id].join('|');
  store.set(PREPOUT_KEY, [...prepOut().filter(x => k(x) !== k(e) && Date.now() - x.rec.t < 2 * 864e5), e]);
}
async function flushPrep(){
  if(!fbReady) return;
  for(const e of prepOut()){
    try{ await db.ref(`stockPrep/${e.date}/${e.station}/${e.id}`).set(e.rec); store.set(PREPOUT_KEY, prepOut().filter(x => !(x.date === e.date && x.station === e.station && x.id === e.id && x.rec.t === e.rec.t))); }
    catch(err){ /* ייתכן שהספירה עצמה עדיין לא הגיעה לשרת. ננסה שוב בפעם הבאה */ }
  }
}

// ============ באנרים ============
function renderBanners(){
  const b = $('banners'); const items = [];
  if(!fbReady) items.push(['err', 'אין חיבור לשרת הספירות. אפשר לספור, והספירה תישלח כשתהיה קליטה.']);
  else if(connected === false && Date.now() - bootAt > 4000) items.push(['', 'אין קליטה. ספירות נשמרות במכשיר ויישלחו כשהחיבור יחזור.']);
  if(flags.defsOld) items.push(['', 'אין חיבור לשרת. מוצגות הגדרות מוצרים שנשמרו במכשיר, והבסיסים עשויים להיות לא מעודכנים.']);
  const pend = outbox().length;
  if(pend) items.push(['', `${pend} ספירות ממתינות לשליחה לשרת.`]);
  if(flags.rejected) items.push(['err', 'ספירה לא נשמרה בשרת (נדחתה). נסו לספור שוב.']);
  if(Math.abs(clockOffset) > 5 * 60e3) items.push(['', 'השעון במכשיר לא מדויק. האפליקציה משתמשת בשעון השרת.']);
  for(const s of SK.STATIONS){ const d = defs[s.key]; if(d && d.error) items.push(['err', `ההגדרות של ${s.name} לא תקינות (חסרה כותרת בטאב). בדקו את הגיליון.`]); }
  b.replaceChildren(...items.map(([c, t]) => { const d = el('div', 'banner' + (c ? ' ' + c : ''), t); return d; }));
}

// ============ טיוטות (ספירה שלא נשמרה לא אובדת) ============
function drafts(){ const d = store.get(DRAFT_KEY); return d && typeof d === 'object' ? d : {}; }
function getDraft(date, st){ const d = drafts()[date + '|' + st]; return d && d.items ? d : null; }
function putDraft(date, st, items, id){
  const all = drafts(); const k = date + '|' + st;
  const prev = all[k];
  all[k] = { id: (prev && prev.id) || newId(), items, ts: Date.now() };
  for(const kk of Object.keys(all)) if(!all[kk] || Date.now() - all[kk].ts > DRAFT_MAX_AGE) delete all[kk];
  store.set(DRAFT_KEY, all);
  return all[k];
}
function dropDraft(date, st){ const all = drafts(); delete all[date + '|' + st]; store.set(DRAFT_KEY, all); }
function newId(){
  try{ if(fbReady) return db.ref().push().key; }catch(e){}
  return '-L' + Date.now().toString(36) + RB.newDeviceId(crypto.getRandomValues(new Uint8Array(6)));
}

// ============ ניווט ============
const safeDecode = x => { try{ return decodeURIComponent(x); }catch(e){ return x; } };
const validDateKey = k => { try{ return typeof k === 'string' && SK.addDays(k, 0) === k && k >= '2020-01-01' && k <= '2099-12-31'; }catch(e){ return false; } };
function go(h){ if(location.hash === h) route(); else location.hash = h; }
window.addEventListener('hashchange', route);
function route(){
  if(!started || !SK) return;
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(safeDecode);
  const view = $('view');
  const [name, a, b, c] = parts;
  const valid = k => SK.STATIONS.some(s => s.key === k);
  // לא מרנדרים מחדש מסך ספירה בזמן שהמשתמש מקליד (עדכון חי מ-Firebase יאבד פוקוס)
  if(name === 'count' && valid(a) && view.dataset.v === 'count:' + a && view.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  if(name === 'prep' && valid(a) && view.dataset.v === 'prep:' + [a, b, c].join('/') && view.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  if(name !== 'admin') stopPrepWatch();
  const keep = view.dataset.v;
  let node, key;
  if(name === 'count' && valid(a)){ node = viewCount(a); key = 'count:' + a; }
  else if(name === 'prep' && valid(a)){ node = viewPrep(a, b, c); key = 'prep:' + [a, b, c].join('/'); }
  else if(name === 'admin' && isAdmin){ node = viewAdmin(a); key = 'admin:' + (a || ''); }
  else if(name === 'history'){ node = viewHistory(); key = 'history'; }
  else { node = viewHome(); key = 'home'; }
  view.dataset.v = key;
  view.replaceChildren(...node);
  if(keep !== key){ window.scrollTo(0, 0); const h = view.querySelector('h1'); if(h){ h.tabIndex = -1; h.focus({ preventScroll: true }); } }
}

// ============ רכיבים ============
function topBar(title, sub, backHash){
  const t = el('div', 'top');
  const back = el('button', 'back', '→'); back.type = 'button'; back.setAttribute('aria-label', 'חזרה'); back.onclick = () => go(backHash || '#/');
  const w = el('div', 'ttl'); w.append(el('h1', '', title)); if(sub) w.append(el('div', 'dim', sub));
  t.append(back, w); return t;
}
function dayBar(){
  const d0 = SK.dayIdx(nowDate()), d1 = (d0 + 1) % 7;
  const bar = el('div', 'days seg'); bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'יום הבסיס');
  const chip = (label, day) => {
    const b = el('button', 'chip', label); b.type = 'button';
    b.setAttribute('aria-pressed', String(curDay() === day && (userDay != null ? true : day === d0)));
    b.onclick = () => { userDay = day === d0 ? null : day; route(); };
    return b;
  };
  const sel = el('select', 'chip'); sel.setAttribute('aria-label', 'יום אחר');
  const o0 = el('option', '', 'יום אחר'); o0.value = ''; sel.append(o0);
  SK.DAYS.forEach((n, i) => { const o = el('option', '', n); o.value = String(i); sel.append(o); });
  sel.onchange = () => { if(sel.value !== '') { const v = Number(sel.value); userDay = v === d0 ? null : v; route(); } };
  sel.value = userDay != null && userDay !== d1 ? String(userDay) : '';
  bar.append(chip('היום · ' + SK.DAYS[d0], d0), chip('מחר · ' + SK.DAYS[d1], d1), sel);
  return bar;
}
function prepFor(st, counts, day){
  const prods = (defs[st] && defs[st].products) || [];
  const act = SK.latestCount(counts);
  return { act, list: act ? SK.prepList(prods, act.items, day) : null };
}

// ============ מסך ראשי ============
function viewHome(){
  const hero = el('div', 'hero');
  hero.append(el('div', 'eyebrow', 'יום הבסיס'));
  const hr = el('div', 'hero-row'); hr.append(el('h1', '', 'יום ' + SK.DAYS[curDay()]), el('span', 'hdate', fmtDate(today).replace(/^[^\d]*/, '')));
  hero.append(hr);
  const out = [hero, dayBar(), el('div', 'sect', 'הפסים')];
  const wrap = el('div', 'stations');
  for(const s of SK.STATIONS){
    const d = defs[s.key] || {};
    const n = SK.productsForDay(d.products || [], curDay()).length;
    const { act, list } = prepFor(s.key, countsFor(today, s.key), curDay());
    const b = el('button', 'st' + (act ? ' done' : '')); b.type = 'button';
    const top = el('div', 'st-top'); top.append(el('h2', '', s.name));
    let sub, tag = '', tagCls = '';
    if(d.missing) sub = 'אין הגדרות מוצרים לפס הזה בגיליון';
    else if(d.empty) sub = 'עדיין אין מוצרים בטאב של הפס הזה בגיליון';
    else if(d.error) sub = 'ההגדרות בגיליון לא תקינות';
    else if(!n) sub = 'אין מוצרים לספירה ביום ' + SK.DAYS[curDay()];
    else if(act){
      sub = `נספר ב-${hhmm(act.t)} על ידי ${act.by} · ${list.prep.length} להכין` + (list.uncounted.length ? ` · ${list.uncounted.length} לא נספרו` : '');
      tag = list.prep.length ? list.prep.length + ' להכין' : 'הכול מספיק'; tagCls = list.prep.length ? ' bad' : ' ok';
    }else{ sub = `עדיין לא נספר היום · ${n === 1 ? 'מוצר אחד' : n + ' מוצרים'}`; tag = 'לספור'; }
    if(tag) top.append(el('span', 'st-tag' + tagCls, tag));
    b.append(top);
    const bot = el('div', 'st-bot');
    if(n){
      const segs = el('span', 'segs'); const filled = act ? n - list.uncounted.length : 0;
      for(let i = 0; i < n && i < 12; i++) segs.append(el('i', i < filled ? 'on' : ''));
      bot.append(segs);
    }
    bot.append(el('p', '', sub)); b.append(bot);
    b.onclick = () => go(act ? '#/prep/' + s.key : '#/count/' + s.key);
    wrap.append(b);
  }
  out.push(wrap);
  const nav = el('nav', 'tabnav'); nav.setAttribute('aria-label', 'ניווט');
  const here = el('span', 'tn on', 'הפסים'); here.setAttribute('aria-current', 'page');
  const h = el('button', 'link tn', 'היסטוריה'); h.type = 'button'; h.onclick = () => go('#/history');
  nav.append(here, h);
  if(isAdmin){ const a = el('button', 'link tn', 'מנהל'); a.type = 'button'; a.setAttribute('aria-label', 'מנהל: מה הפסים הזינו'); a.onclick = () => go('#/admin'); nav.append(a); }
  out.push(nav);
  return out;
}

// ============ ספירה ============
function parseNum(s){ const n = Number(String(s).trim().replace(',', '.')); return String(s).trim() === '' ? NaN : n; }
function viewCount(st){
  const day = curDay();
  const prods = SK.productsForDay((defs[st] && defs[st].products) || [], day);
  const out = [topBar(stationName(st), 'ספירה · בסיס של יום ' + SK.DAYS[day], '#/')];
  if(!prods.length){ out.push(el('div', 'empty', 'אין מוצרים לספירה בפס הזה ביום ' + SK.DAYS[day] + '.')); return out; }
  // התאריך של הספירה נקבע כשמסך הספירה נפתח ונשאר כל עוד הוא פתוח, גם אם עבר חצות באמצע
  const vw = $('view');
  const date = vw.dataset.v === 'count:' + st && vw.dataset.countDate ? vw.dataset.countDate : today;
  vw.dataset.countDate = date;
  const draft = getDraft(date, st);
  const vals = Object.assign({}, draft ? draft.items : {});
  const errBox = el('div', 'banner err'); errBox.hidden = true; errBox.setAttribute('role', 'alert');
  const progress = el('div', 'progress'); const pcount = el('span', 'pcount'); const psegs = el('span', 'psegs'); progress.append(pcount, psegs);
  let sender = '';
  try{ sender = localStorage.getItem(SENDER_KEY) || ''; }catch(e){}
  const nameIn = el('input'); nameIn.type = 'text'; nameIn.maxLength = 40; nameIn.value = sender || typedName; nameIn.autocomplete = 'name'; nameIn.id = 'sender-in';
  nameIn.addEventListener('input', () => { typedName = nameIn.value; });
  const nameField = el('div', 'field'); const nl = el('label', '', 'השם שלך'); nl.htmlFor = 'sender-in'; nameField.append(nl, nameIn);
  out.push(nameField);
  const prevC = SK.latestCount(countsFor(today, st)); const prevItems = prevC ? prevC.items : {};
  const rows = el('div', 'rows');
  const save = el('button', 'btn primary', 'שמור ספירה והצג הכנות'); save.type = 'button';
  const rowEls = {};
  const saveDraft = () => putDraft(date, st, vals);
  const refresh = () => {
    const n = prods.filter(p => vals[SK.sanitizeKey(p.name)] !== undefined && String(vals[SK.sanitizeKey(p.name)]).trim() !== '').length;
    pcount.textContent = `נספרו ${n} מתוך ${prods.length}`;
    psegs.replaceChildren(...prods.map((p, i) => el('i', i < n ? 'on' : '')));
    save.disabled = saving;
  };
  for(const p of prods){
    const key = SK.sanitizeKey(p.name);
    const row = el('div', 'row'); rowEls[key] = row;
    const box = !!p.boxVol;                                  // מוצר בקופסה: סופרים קופסאות (גם חצאים) ושומרים ביחידת המוצר
    const l1 = el('div', 'l1'); l1.append(el('span', 'nm', p.name), el('span', 'base', `בסיס ${SK.fmtQty(SK.baseFor(p, day))} ${p.unit || ''}`.trim()));
    const kind = box ? `סופרים קופסאות. קופסה אחת = ${SK.fmtQty(p.boxVol)} ${p.unit || ''}`.trim() : p.portionG ? `סופרים מנות. מנה = ${SK.fmtQty(p.portionG)} גרם` : '';
    const conv = el('div', 'conv'); conv.hidden = true;
    const inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.value = vals[key] ?? '';
    { const pv = prevItems[key]; inp.placeholder = typeof pv === 'number' ? 'קודם ' + SK.fmtQty(box ? Math.round(pv / p.boxVol * 100) / 100 : pv) : '—'; }   // רמז בלבד, לא ערך: אי אפשר לשמור בטעות ספירה ישנה
    inp.setAttribute('aria-label', box ? `כמה קופסאות יש: ${p.name}` : `כמה יש: ${p.name}${p.unit ? ' (' + p.unit + ')' : ''}`);
    inp.enterKeyHint = 'done'; inp.addEventListener('focus', () => setTimeout(() => { try{ inp.select(); }catch(e){} }, 0));
    const baseQ = SK.baseFor(p, day), warnEl = el('div', 'warn'); warnEl.hidden = true;
    const toUnits = n => box ? SK.unitsOfBoxes(p, n) : n;
    const updConv = () => {
      const n = parseNum(inp.value);
      if(isNaN(n) || n < 0 || (!box && !p.portionG)){ conv.hidden = true; return; }
      conv.textContent = box ? `= ${SK.fmtQty(toUnits(n))} ${p.unit || ''}`.trim() : '= ' + SK.describe(p, n);
      conv.hidden = false;
    };
    const updWarn = () => { updConv(); const n0 = parseNum(inp.value); const n = isNaN(n0) ? n0 : toUnits(n0); const big = !isNaN(n) && baseQ && n > baseQ * 3; warnEl.hidden = !big; row.classList.toggle('warnrow', !!big); if(big) warnEl.textContent = `הרבה יותר מהיעד (${SK.fmtQty(baseQ)}${p.unit ? ' ' + p.unit : ''}). בטוחים?`; };
    const cur = () => { const n = parseNum(inp.value); return n; };
    const set = v => { inp.value = v; vals[key] = v; row.classList.remove('bad'); saveDraft(); updWarn(); refresh(); };
    inp.addEventListener('input', () => { vals[key] = inp.value; row.classList.remove('bad'); inp.removeAttribute('aria-invalid'); saveDraft(); updWarn(); refresh(); });
    const minus = el('button', 'step', '−'); minus.type = 'button'; minus.setAttribute('aria-label', 'הפחת ' + p.name);
    const plus = el('button', 'step', '+'); plus.type = 'button'; plus.setAttribute('aria-label', 'הוסף ' + p.name);
    const stp = box ? 0.5 : 1;
    minus.onclick = () => { const n = cur(); set(isNaN(n) ? '0' : SK.fmtQty(Math.max(0, Math.round((n - stp) * 100) / 100))); };
    plus.onclick = () => { const n = cur(); set(isNaN(n) ? SK.fmtQty(stp) : SK.fmtQty(Math.round((n + stp) * 100) / 100)); };
    const clr = el('button', 'clr', 'ניקוי'); clr.type = 'button'; clr.setAttribute('aria-label', 'סמן כלא נספר: ' + p.name); clr.onclick = () => set('');
    const l2 = el('div', 'l2'); l2.append(minus, inp, plus, clr);
    const kindEl = kind ? el('div', 'kind', kind) : null;
    row.append(...[l1, kindEl, l2, conv, warnEl].filter(Boolean)); updWarn(); rows.append(row);
  }
  out.push(progress, errBox, rows);
  const bar = el('div', 'bar'); bar.append(save); out.push(bar);
  save.onclick = async () => {
    if(saving) return;
    const who = nameIn.value.trim().slice(0, 40);
    errBox.hidden = true;
    if(!who){ errBox.textContent = 'כתבו את השם שלכם לפני השמירה.'; errBox.hidden = false; nameIn.focus(); return; }
    const raw = {};
    for(const p of prods){
      const k = SK.sanitizeKey(p.name); if(vals[k] === undefined) continue;
      const n = parseNum(vals[k]);
      raw[k] = p.boxVol && !isNaN(n) && n >= 0 ? String(SK.unitsOfBoxes(p, n)) : vals[k];     // מוצר בקופסה: מקופסאות ליחידת המוצר
    }
    const v = SK.validateCount(prods, raw, day);
    if(!v.ok){
      errBox.textContent = v.errors.join(' · '); errBox.hidden = false;
      for(const p of prods){ const k = SK.sanitizeKey(p.name); const s = String(raw[k] ?? '').trim(); if(s !== '' && v.clean[k] === undefined){ rowEls[k].classList.add('bad'); rowEls[k].querySelector('input').setAttribute('aria-invalid', 'true'); } }
      errBox.scrollIntoView({ block: 'nearest' }); return;
    }
    saving = true; save.disabled = true; save.textContent = 'שומר...';
    try{ localStorage.setItem(SENDER_KEY, who); }catch(e){}
    const d = putDraft(date, st, vals);                      // המזהה נקבע פעם אחת לטיוטה: שמירה חוזרת לא יוצרת ספירה כפולה
    const e = { date, station: st, id: d.id, count: { t: nowMs(), by: who, items: v.clean } };
    if(!outbox().some(x => x.id === e.id)) store.set(OUTBOX_KEY, outbox().concat([e]));
    dropDraft(date, st);
    saving = false;
    say('הספירה נשמרה');
    location.replace(date === today ? '#/prep/' + st : '#/prep/' + st + '/' + date + '/' + e.id);
    flush();
  };
  refresh();
  return out;
}

// ============ רשימת הכנות ============
function viewPrep(st, date, id){
  const specific = !!(date && id);
  if(specific && !validDateKey(date)) return [topBar(stationName(st), 'ספירה לא נמצאה', '#/history'), el('div', 'empty', 'הקישור לא תקין.')];
  const d = specific ? date : today;
  loadHist(d);
  const counts = countsFor(d, st);
  const day = specific ? dayOfDateKey(d) : curDay();
  const out = [topBar(stationName(st), specific ? 'ספירה מ-' + fmtDate(d) : 'רשימת הכנות · בסיס של יום ' + SK.DAYS[day], specific ? '#/history' : '#/')];
  const c = specific ? (counts[id] ? { id, ...counts[id] } : null) : SK.latestCount(counts);
  if(!c){
    out.push(el('div', 'empty', specific ? 'הספירה לא נמצאה.' : 'עדיין לא נספר היום.'));
    const b = el('button', 'btn primary', 'התחילו ספירה'); b.type = 'button'; b.onclick = () => go('#/count/' + st);
    out.push(b); return out;
  }
  const prods = (defs[st] && defs[st].products) || [];
  const list = SK.prepList(prods, c.items, day);
  out.push(el('div', 'dim', `נספר ב-${hhmm(c.t)} על ידי ${c.by}` + (specific ? ' · לפי ההגדרות הנוכחיות של המוצרים והבסיס של יום ' + SK.DAYS[day] : '')));
  const nCounts = Object.keys(counts).length;
  if(!specific && nCounts > 1){ const h = el('button', 'link', `ספירות קודמות היום: ${nCounts - 1}`); h.type = 'button'; h.onclick = () => go('#/history'); out.push(h); }

  // הכמות שהטבח מחליט להכין: ברירת מחדל = החסר, ניתן לשנות, נשמר במכשיר
  const pk = [st, d, c.id, day].join('|');
  const saved = (prepVals()[pk] || {}).v || {};
  const chosen = Object.create(null);
  for(const it of list.prep){ const v = saved[SK.sanitizeKey(it.name)]; chosen[it.name] = (typeof v === 'number' && isFinite(v) && v >= 0 && v <= 100000) ? v : it.need; }
  // מוצר שמספיק: ברירת מחדל 0, אבל אפשר להכין בכל זאת (למשל לקראת יום עמוס או להקפאה)
  for(const it of list.enough){ const v = saved[SK.sanitizeKey(it.name)]; chosen[it.name] = (typeof v === 'number' && isFinite(v) && v >= 0 && v <= 100000) ? v : 0; }
  const prodByName = Object.create(null); for(const p of prods) prodByName[p.name] = p;
  const fmtOf = (name, q) => { const p = prodByName[name], d = SK.describe(p, q); return d ? SK.fmtFull(p, q) : ''; };   // ריק כשאין תיאור משני: ההודעה נשארת כמו קודם
  const waRows = () => [
    ...list.prep.map(it => ({ name: it.name, unit: it.unit, have: it.have, haveFmt: fmtOf(it.name, it.have), prep: chosen[it.name], prepFmt: fmtOf(it.name, chosen[it.name]), need: it.need, cover: SK.coverage(prodByName[it.name], it.have + chosen[it.name], day) })),
    ...list.uncounted.map(it => ({ name: it.name, unit: it.unit })),
    ...list.enough.map(it => ({ name: it.name, unit: it.unit, have: it.have, haveFmt: fmtOf(it.name, it.have), prep: chosen[it.name], prepFmt: fmtOf(it.name, chosen[it.name]), cover: SK.coverage(prodByName[it.name], it.have, day) }))
  ];
  const wa = el('a', 'btn wa', 'שלח בוואטסאפ');
  const updateWa = () => { wa.href = 'https://wa.me/?text=' + encodeURIComponent(SK.formatWhatsApp({ station: stationName(st), dateKey: d, dayName: SK.DAYS[day], by: c.by, rows: waRows() })); };
  const persist = () => { const all = prepVals(); const v = {}; for(const it of [...list.prep, ...list.enough]) v[SK.sanitizeKey(it.name)] = chosen[it.name]; all[pk] = { ts: Date.now(), v }; for(const k of Object.keys(all)) if(!all[k] || Date.now() - all[k].ts > 3 * 864e5) delete all[k]; store.set(PREP_KEY, all); };

  out.push(el('div', 'grp', `להכין (${list.prep.length})`));
  const wrap = el('div', 'rows prep-list');
  if(!list.prep.length) wrap.append(el('div', 'empty', !list.enough.length ? 'לא נספר אף מוצר, אז אין מה להכין.' : list.uncounted.length ? 'אין מה להכין לפי מה שנספר.' : 'אין מה להכין לפי הבסיס. אפשר להכין בכל זאת מהרשימה למטה.'));
  const buildRow = (it, extra, target) => {
    const r = el('div', 'need'); const info = el('div', 'info');
    const pd = prodByName[it.name];
    const haveTxt = SK.fmtQty(it.have) + (pd && pd.boxVol ? ` (${SK.describe(pd, it.have)})` : '');
    info.append(el('div', 'nm', it.name), el('div', 'sub', `יש ${haveTxt} מתוך ${SK.fmtQty(it.base)}${it.unit ? ' ' + it.unit : ''} · ` + (extra ? 'מספיק' : 'חסר ' + SK.fmtQty(it.need))));
    const convEl = el('div', 'conv'); convEl.hidden = true; info.append(convEl);
    if(it.note) info.append(el('div', 'sub', it.note));
    const cov = el('div', 'cov'); const strip = el('div', 'strip'); info.append(strip, cov);
    const a = el('a', 'rlink', 'פתח מתכון'); const setLink = () => { a.href = './recipes.html#q=' + encodeURIComponent(it.recipe || (prodByName[it.name] && prodByName[it.name].recipe) || it.name) + (chosen[it.name] > 0 ? '&need=' + chosen[it.name] : ''); }; info.append(a);
    const pq = el('div', 'pq'); const l2 = el('div', 'l2');
    const minus = el('button', 'step', '−'); minus.type = 'button'; minus.setAttribute('aria-label', 'הפחת ' + it.name);
    const plus = el('button', 'step', '+'); plus.type = 'button'; plus.setAttribute('aria-label', 'הוסף ' + it.name);
    const inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.setAttribute('aria-label', 'כמה להכין ' + it.name);
    inp.value = SK.fmtQty(chosen[it.name]);
    const step = it.base >= 20 ? 5 : it.base >= 5 ? 1 : 0.5;
    inp.enterKeyHint = 'done'; inp.addEventListener('focus', () => setTimeout(() => { try{ inp.select(); }catch(e){} }, 0));
    const warnEl = el('div', 'warn'); warnEl.hidden = true; info.append(warnEl);
    let chipEls = null;
    const showCov = () => {
      setLink();
      const tot = it.have + chosen[it.name], cd = SK.coverageDays(prodByName[it.name], tot, day);
      cov.textContent = SK.coverage(prodByName[it.name], tot, day);
      strip.replaceChildren(...(() => {
        const cells = []; const days = cd ? cd.days : [];
        for(let i = 0; i < 7; i++){
          const dn = (day + i) % 7, x = days.find(z => z.day === dn);
          const c = el('span', 'sc'); const bx = el('span', 'sb'); const fr = el('i', '');
          if(x) fr.style.height = Math.round(Math.min(1, x.got / x.need) * 100) + '%'; else if(cd && cd.week && SK.baseFor(prodByName[it.name], dn) !== null) fr.style.height = '100%';
          if(x && x.got < x.need) fr.className = 'part';
          if(SK.baseFor(prodByName[it.name], dn) === null) bx.classList.add('off');
          bx.append(fr); c.append(bx, el('span', 'sl', 'אבגדהוש'[dn])); cells.push(c);
        }
        return cells;
      })());
      cov.className = 'cov' + (cd && !cd.week ? (cd.days.length <= 1 ? ' lvl-bad' : cd.days.length === 2 ? ' lvl-warn' : '') : '');
      { const d = SK.describe(pd, chosen[it.name]), m = SK.recipeMult(pd, chosen[it.name]);
        const bits = []; if(d && chosen[it.name] > 0) bits.push('= ' + d); if(m !== null && chosen[it.name] > 0) bits.push('≈ ' + SK.fmtQty(m) + ' מתכון');
        convEl.textContent = bits.join(' · '); convEl.hidden = !bits.length; }
      if(chipEls) chipEls.forEach(([b, q]) => b.setAttribute('aria-pressed', String(Math.abs(q - chosen[it.name]) < 0.005)));
      const big = chosen[it.name] > it.base * 2; warnEl.hidden = !big;
      if(big) warnEl.textContent = `הרבה יותר מהיעד (${SK.fmtQty(it.base)}${it.unit ? ' ' + it.unit : ''}). בטוחים?`;
    };
    const set = n => { chosen[it.name] = n; showCov(); updateWa(); persist(); };
    inp.addEventListener('input', () => { const t = inp.value.trim().replace(',', '.'); if(!/^\d+(\.\d{1,2})?$/.test(t)) return; const n = Number(t); if(n <= 100000) set(n); });
    inp.addEventListener('blur', () => { inp.value = SK.fmtQty(chosen[it.name]); });
    minus.onclick = () => { const n = Math.max(0, Math.round((chosen[it.name] - step) * 100) / 100); inp.value = SK.fmtQty(n); set(n); };
    plus.onclick = () => { const n = Math.min(100000, Math.round((chosen[it.name] + step) * 100) / 100); inp.value = SK.fmtQty(n); set(n); };
    showCov();
    l2.append(minus, inp, plus); pq.append(el('span', '', 'להכין' + (it.unit ? ' (' + it.unit + ')' : '')), l2);
    r.classList.add('wrapcol'); r.append(info, pq);
    if(pd && pd.sizes && pd.sizes.length){
      const chips = el('div', 'chips'); chips.setAttribute('role', 'group'); chips.setAttribute('aria-label', 'גדלי מתכון: ' + it.name);
      chipEls = pd.sizes.map(z => {
        const b = el('button', 'chip', `${z.label} · ${SK.fmtQty(z.qty)}${it.unit ? ' ' + it.unit : ''}`); b.type = 'button';
        b.onclick = () => { inp.value = SK.fmtQty(z.qty); set(z.qty); };
        chips.append(b); return [b, z.qty];
      });
      r.append(chips); showCov();
    }
    target.append(r);
  };
  for(const it of list.prep) buildRow(it, false, wrap);
  out.push(wrap);
  if(list.uncounted.length){
    out.push(el('div', 'grp', `לא נספר (${list.uncounted.length})`));
    const u = el('div', ''); for(const it of list.uncounted){ const m = el('div', 'mini'); m.append(el('span', '', it.name), el('span', 'dim', `בסיס ${SK.fmtQty(it.base)} ${it.unit || ''}`.trim())); u.append(m); }
    out.push(u);
  }
  if(list.enough.length){
    const det = el('details', 'grp-d'); det.append(el('summary', '', `מספיק (${list.enough.length}) · אפשר להכין בכל זאת`));
    if(!list.prep.length || list.enough.some(it => chosen[it.name] > 0)) det.open = true;
    const eb = el('div', 'rows'); for(const it of list.enough) buildRow(it, true, eb);
    det.append(eb); out.push(det);
  }
  const acts = el('div', 'actions pbar');
  if(!specific){ const n = el('button', 'btn', 'ספירה חדשה'); n.type = 'button'; n.onclick = () => go('#/count/' + st); acts.append(n); }
  updateWa();
  let lastWa = 0;
  wa.addEventListener('click', ev => {
    if(Date.now() - lastWa < 1500){ ev.preventDefault(); return; }
    lastWa = Date.now();
    const items = {};
    for(const it of list.prep) items[SK.sanitizeKey(it.name)] = chosen[it.name];
    for(const it of list.enough) items[SK.sanitizeKey(it.name)] = chosen[it.name];
    if(!Object.keys(items).length) return;
    queuePrep({ date: d, station: st, id: c.id, rec: { t: Date.now() + clockOffset, by: String(c.by).slice(0, 40), day, items } });
    flush();
  });
  wa.target = '_blank'; wa.rel = 'noopener'; acts.append(wa);
  out.push(acts);
  return out;
}

// ============ מנהל: מה הפסים הזינו (קריאה בלבד) ============
let prepWatch = { date: '', off: null, data: null };
function normPrep(v){
  const out = {};
  for(const s of SK.STATIONS){
    out[s.key] = {};
    const o = v && typeof v === 'object' ? v[s.key] : null;
    if(!o || typeof o !== 'object') continue;
    for(const [id, r] of Object.entries(o)){
      if(id === '__proto__') continue;
      if(!r || typeof r !== 'object' || typeof r.t !== 'number' || !Number.isInteger(r.day) || r.day < 0 || r.day > 6 || !r.items || typeof r.items !== 'object') continue;
      const items = {}; for(const [k, x] of Object.entries(r.items)) if(k !== '__proto__' && typeof x === 'number' && isFinite(x) && x >= 0) items[k] = x;
      out[s.key][id] = { t: r.t, by: cleanBy(r.by), day: r.day, items };
    }
  }
  return out;
}
function stopPrepWatch(){ if(prepWatch.off) prepWatch.off(); prepWatch = { date: '', off: null, data: null }; }
function watchPrep(date){
  if(prepWatch.date === date) return;
  stopPrepWatch(); prepWatch.date = date;
  if(!fbReady){ prepWatch.data = normPrep(null); return; }
  const ref = db.ref('stockPrep/' + date);
  const cb = snap => { if(prepWatch.date === date){ prepWatch.data = normPrep(snap.val()); route(); } };
  ref.on('value', cb, () => { if(prepWatch.date === date){ prepWatch.data = normPrep(null); route(); } });
  prepWatch.off = () => ref.off('value', cb);
}
const prevPrepCache = Object.create(null);
function loadPrevPrep(d){
  if(prevPrepCache[d] !== undefined || !fbReady) return;
  prevPrepCache[d] = null;
  db.ref('stockPrep/' + d).once('value').then(sn => { prevPrepCache[d] = normPrep(sn.val()); route(); }, () => { prevPrepCache[d] = normPrep(null); route(); });
}
function consumptionBlock(stKey, date, prods){
  const prev = SK.addDays(date, -1);
  const pd = histCache[prev], pp = prevPrepCache[prev];
  const box = el('details', 'adm');
  box.append(el('summary', '', 'צריכה מאז הספירה של אתמול'));
  if(!fbReady || pd === null || pp === null || pd === undefined || pp === undefined){ box.append(el('div', 'dim', 'טוען...')); return box; }
  const cur = SK.latestCount(countsFor(date, stKey)), old = SK.latestCount((pd || {})[stKey]);
  if(!cur || !old){ box.append(el('div', 'dim', 'אין ספירה גם אתמול וגם היום, אז אי אפשר לחשב.')); return box; }
  const rec = ((pp || {})[stKey] || {})[old.id];
  const rows = SK.consumption(prods, old.items, rec ? rec.items : null, cur.items, rec ? rec.day : dayOfDateKey(prev));
  if(!rows.length){ box.append(el('div', 'dim', 'אין מוצרים שנספרו בשתי הספירות.')); return box; }
  const body = el('div', 'body');
  for(const r of rows){
    const u = r.unit ? ' ' + r.unit : '';
    let txt, cls = 'dl';
    if(r.odd){ txt = 'לא מסתדר (נכנסה סחורה, או שההכנה לא בוצעה)'; }
    else{
      txt = 'נצרך ' + SK.fmtQty(r.used) + u + (r.base ? ' · בסיס ' + SK.fmtQty(r.base) : '');
      if(r.base && r.used > r.base * 1.25) { txt += ' · מעל הבסיס'; cls += ' short'; }
      else if(r.base && r.used < r.base * 0.6) txt += ' · הרבה מתחת לבסיס';
    }
    const row = el('div', cls); row.append(el('span', '', r.name), el('span', '', txt)); body.append(row);
  }
  body.append(el('div', 'cv', 'חישוב: מה שהיה בספירה של אתמול + מה שהוחלט להכין, פחות מה שנשאר עכשיו.' + (rows.some(x => !x.prepKnown) ? ' אם לא נשלחה החלטת הכנה, ההכנה נחשבת אפס.' : '') + ' ההכנה נחשבת כאילו בוצעה במלואה.'));
  box.append(body); return box;
}
function viewAdmin(dateArg){
  const date = dateArg && validDateKey(dateArg) ? dateArg : today;
  const out = [topBar('מנהל', 'מה כל פס ספר והחליט להכין. לקריאה בלבד.', '#/')];
  const bar = el('div', 'adm-date');
  const inp = el('input'); inp.type = 'date'; inp.value = date; inp.max = today; inp.setAttribute('aria-label', 'תאריך');
  inp.onchange = () => { if(inp.value && validDateKey(inp.value)) go('#/admin/' + inp.value); };
  const chip = (label, k) => { const b = el('button', 'chip', label); b.type = 'button'; b.setAttribute('aria-pressed', String(date === k)); b.onclick = () => go('#/admin/' + k); return b; };
  bar.append(chip('היום', today), chip('אתמול', SK.addDays(today, -1)), inp);
  out.push(bar, el('div', 'hday', fmtDate(date)));
  if(lintList.length){
    const lb = el('div', 'banner');
    lb.append(el('b', '', `בגיליון יש ${lintList.length} מוצרים שהמתכון שלהם לא קיים בספר, אז "פתח מתכון" לא ימצא אותם:`));
    for(const x of lintList.slice(0, 8)) lb.append(el('div', '', `${(SK.STATIONS.find(s => s.key === x.st) || {}).name || x.st}: ${x.product} ← "${x.recipe}"`));
    if(lintList.length > 8) lb.append(el('div', '', `ועוד ${lintList.length - 8}`));
    out.push(lb);
  }
  loadHist(date); watchPrep(date); loadHist(SK.addDays(date, -1)); loadPrevPrep(SK.addDays(date, -1));
  if((date !== today && histCache[date] === null) || prepWatch.data === null){ out.push(el('div', 'dim', 'טוען...')); return out; }
  const unitOf = u => u ? ' ' + u : '';
  for(const s of SK.STATIONS){
    const sec = el('section'); sec.append(el('div', 'grp', s.name));
    const counts = countsFor(date, s.key), act = SK.latestCount(counts);
    if(!act){ sec.append(el('div', 'dim', 'לא נספר ביום הזה')); out.push(sec); continue; }
    const rec = (prepWatch.data[s.key] || {})[act.id];
    const nOld = Object.keys(counts).length - 1;
    sec.append(el('div', 'dim', `נספר ב-${hhmm(act.t)} על ידי ${act.by}` + (rec ? ` · החלטת הכנה נשלחה ב-${hhmm(rec.t)}` : ' · הטבח עוד לא שלח החלטת הכנה') + (nOld > 0 ? ` · עוד ${nOld} ספירות קודמות באותו יום` : '')));
    const day = rec ? rec.day : dayOfDateKey(date);
    const prods = (defs[s.key] && defs[s.key].products) || [];
    const list = SK.prepList(prods, act.items, day);
    const byName = Object.create(null); for(const p of prods) byName[p.name] = p;
    const all = [...list.prep.map(x => ({ ...x, need: x.need })), ...list.enough.map(x => ({ ...x, need: 0 })), ...list.uncounted.map(x => ({ ...x, have: undefined }))];
    if(!all.length) sec.append(el('div', 'dim', 'אין מוצרים לספירה ביום הזה'));
    for(const it of all){
      const key = SK.sanitizeKey(it.name), p = byName[it.name];
      const counted = typeof it.have === 'number';
      const decided = rec && typeof rec.items[key] === 'number';
      const prep = decided ? rec.items[key] : undefined;
      const det = el('details', 'adm'); const sm = el('summary');
      sm.append(el('span', 'nm', it.name));
      const qs = el('span', 'qs');
      if(!counted) qs.textContent = 'לא נספר';
      else{
        qs.append('יש ' + SK.fmtQty(it.have) + ' · ');
        if(decided) { const b = el('b', '', 'להכין ' + SK.fmtQty(prep)); qs.append(b); }
        else qs.append(it.need > 0 ? `חסר ${SK.fmtQty(it.need)}` : 'מספיק');
      }
      sm.append(qs); det.append(sm);
      if(counted && p){
        const body = el('div', 'body'); const total = it.have + (decided ? prep : 0);
        body.append(el('div', 'tot', `יש ${SK.fmtQty(it.have)}` + (decided ? ` + להכין ${SK.fmtQty(prep)} = ${SK.fmtQty(total)}` : (rec ? ' · הטבח לא קבע כמות' : ' · עוד אין החלטה, זה מה שיש כרגע')) + unitOf(it.unit)));
        const cd = SK.coverageDays(p, total, day);
        if(cd) for(const x of cd.days){
          const short = x.got < x.need;
          const row = el('div', 'dl' + (short ? ' short' : '')); row.append(el('span', '', 'יום ' + SK.DAYS[x.day]), el('span', '', `${SK.fmtQty(x.got)}/${SK.fmtQty(x.need)}` + (short ? ' ← מספיק עד כאן' : '')));
          body.append(row);
        }
        body.append(el('div', 'cv', SK.coverage(p, total, day)));
        det.append(body);
      }
      sec.append(det);
    }
    sec.append(consumptionBlock(s.key, date, prods));
    const lk = el('a', 'link', 'פתח את רשימת ההכנות של הספירה'); lk.href = `#/prep/${s.key}/${date}/${encodeURIComponent(act.id)}`;
    sec.append(lk);
    out.push(sec);
  }
  return out;
}

// ============ היסטוריה ודוח ============
function loadHist(date){
  if(date === today || histCache[date] || !fbReady) return;
  histCache[date] = null;
  db.ref('stock/' + date).once('value').then(s => { histCache[date] = normDay(s.val(), date); route(); }, () => { histCache[date] = normDay(null); route(); });
}
function viewHistory(){
  const out = [topBar('היסטוריה ודוח', 'הרשימות מחושבות לפי ההגדרות הנוכחיות של המוצרים והבסיס של יום השבוע של התאריך.', '#/')];
  for(let i = 0; i < histDays; i++){
    const date = SK.addDays(today, -i);
    loadHist(date);
    const sec = el('section'); sec.append(el('div', 'hday', fmtDate(date)));
    const dayData = date === today ? live : histCache[date];
    if(date !== today && dayData === null){ sec.append(el('div', 'dim', 'טוען...')); out.push(sec); continue; }
    let any = false;
    for(const s of SK.STATIONS){
      const counts = countsFor(date, s.key);
      const ids = Object.keys(counts).sort((x, y) => counts[y].t - counts[x].t || (x < y ? 1 : -1));
      if(!ids.length) continue; any = true;
      const act = SK.latestCount(counts);
      const g = el('div', 'hst'); g.append(el('div', 't', s.name));
      for(const id of ids){
        const c = counts[id];
        const b = el('button', 'hc'); b.type = 'button';
        const l = el('span', '', `${hhmm(c.t)} · ${c.by}`);
        const r = el('span'); const nPrep = SK.prepList((defs[s.key] || {}).products || [], c.items, dayOfDateKey(date)).prep.length;
        r.append(el('span', 'dim', `${nPrep} להכין `)); if(act && act.id === id) r.append(el('span', 'tag', 'פעילה'));
        b.append(l, r);
        b.onclick = () => go(`#/prep/${s.key}/${date}/${encodeURIComponent(id)}`);
        g.append(b);
      }
      sec.append(g);
    }
    if(!any) sec.append(el('div', 'dim', 'אין ספירות'));
    out.push(sec);
  }
  const more = el('button', 'btn', 'עוד 7 ימים'); more.type = 'button'; more.onclick = () => { histDays += 7; route(); };
  out.push(el('div', 'actions').appendChild(more).parentNode);
  return out;
}

// ============ הפעלה ============
function start(){
  started = true;
  renderBanners();
  watchToday();
  if(!location.hash) history.replaceState(null, '', '#/');
  route();
}
(function init(){
  if(!SK){ $('view').append(el('div', 'banner err', 'שגיאת טעינה: stock-lib.js לא נטען.')); return; }
  initFb();
  renderBanners();
  boot();
  setTimeout(flush, 1500);
  setTimeout(renderBanners, 4200);
})();
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./stock-sw.js', { scope: './stock.html' }).catch(() => {}));
}
